<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Good Look — Entrar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #fef3e5 0%, #e5eaff 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #1e293b;
    }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(15,23,42,0.08); padding: 32px 28px; width: 100%; max-width: 360px; text-align: center; }
    .brand { font-size: 24px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
    .lead { font-size: 14px; color: #94a3b8; margin-bottom: 22px; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; background: #f1f5f9; margin: 0 auto 22px; display: flex; align-items: center; justify-content: center; color: #cbd5e1; overflow: hidden; cursor: pointer; position: relative; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar svg { width: 28px; height: 28px; }
    .field { width: 100%; padding: 13px 14px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 15px; color: #334155; margin-bottom: 12px; outline: none; transition: border-color .15s; }
    .field:focus { border-color: #F97316; }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; background: #F97316; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; }
    .btn:active { transform: scale(0.98); }
    .btn-sec { background: transparent; color: #64748b; font-size: 14px; margin-top: 14px; font-weight: 600; }
    .err { color: #ef4444; font-size: 13px; margin-bottom: 10px; display: none; }
    .foot { margin-top: 18px; font-size: 14px; color: #94a3b8; }
    .foot a { color: #0f172a; font-weight: 700; text-decoration: none; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #f1f5f9; color: #64748b; font-size: 14px; font-weight: 600; cursor: pointer; }
    .tab.active { background: #F97316; color: #fff; }
    #photoData { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Good Look</div>
    <div class="lead">Entrar ou criar conta</div>
    <div class="tabs">
      <button class="tab active" id="tabCreate" onclick="switchTab('create')">Criar conta</button>
      <button class="tab" id="tabLogin" onclick="switchTab('login')">Entrar</button>
    </div>
    <div id="createForm">
      <div class="avatar" id="avatarBtn" onclick="document.getElementById('photoInput').click()">
        <svg id="avatarIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 0-2 2H3a2 2 0 0 0-2-2"/><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14"/><circle cx="12" cy="9" r="2.5"/><path d="M7 17c0-2.8 2.2-5 5-5s5 2.2 5 5"/></svg>
        <img id="avatarImg" style="display:none" />
      </div>
      <input type="file" id="photoInput" accept="image/*" style="display:none" />
      <input class="field" id="cName" type="text" placeholder="Nome" />
      <input class="field" id="cPass" type="password" placeholder="Senha" />
      <div class="err" id="cErr"></div>
      <button class="btn" onclick="createAccount()">Criar conta</button>
    </div>
    <div id="loginForm" style="display:none">
      <input class="field" id="lName" type="text" placeholder="Nome" />
      <input class="field" id="lPass" type="password" placeholder="Senha" />
      <div class="err" id="lErr"></div>
      <button class="btn" onclick="loginAccount()">Entrar</button>
    </div>
    <div class="foot"><a href="index.html">← Voltar</a></div>
  </div>
  <script src="sync.js"></script>
  <script>
    (function(){
      // Seed creator account
      var users = JSON.parse(localStorage.getItem('gl_users') || '[]');
      var creator = users.find(function(u){return u.username==='tex_tt';});
      if (!creator) {
        users.push({ id:'creator', name:'tex_tt', username:'tex_tt', password:'12345678910', photo:null, bio:'👑 Criador do Good Look', followers:100000, following:[], likes:0, verified:true, verifiedType:'blue', isCreator:true, isAdmin:true, banned:false, banUntil:null, savedVideos:[] });
        localStorage.setItem('gl_users', JSON.stringify(users));
      } else if (creator.name!=='tex_tt' || creator.password!=='12345678910') {
        creator.name = 'tex_tt';
        creator.password = '12345678910';
        localStorage.setItem('gl_users', JSON.stringify(users));
      }
      // Os vídeos de exemplo saíram do ar: quem publica na Home e no Shorts são
      // as pessoas de verdade que usam o app.
      var vids = JSON.parse(localStorage.getItem('gl_videos') || '[]').filter(function(v){ return ['v0','v1','v2','s0','s1','s2'].indexOf(v.id)<0; });
      localStorage.setItem('gl_videos', JSON.stringify(vids));
      // Auto-login. Quem já tinha conta neste aparelho entra direto e, se a
      // conta é de antes do servidor, ela é registrada lá com a mesma senha.
      // Conta banida também entra: lá dentro ela só vê o próprio perfil e a
      // conversa com a assistente de suporte, que é quem libera a conta.
      var cur = localStorage.getItem('gl_current_user');
      var u = cur ? users.find(function(x){return x.id===cur;}) : null;
      if (u) {
        if (localStorage.getItem('gl_token') || !u.password) { window.location.href = 'app.html'; return; }
        SYNC.entrar(u.name, u.password).then(function(j){
          SYNC.guardarSessao(j);
          window.location.href = 'app.html';
        }).catch(function(e){
          if (e && e.status === 404) {
            return SYNC.criar(u.name, u.password, u.photo).then(function(j){
              SYNC.guardarSessao(j);
              window.location.href = 'app.html';
            });
          }
          if (!e || !e.status) { window.location.href = 'app.html'; return; }  // sem servidor: modo local
        });
      }
    })();

    var photoData = null;
    document.getElementById('photoInput').addEventListener('change', function(e){
      var f = e.target.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function(ev){
        photoData = ev.target.result;
        var img = document.getElementById('avatarImg');
        img.src = photoData; img.style.display = 'block';
        document.getElementById('avatarIcon').style.display = 'none';
      };
      r.readAsDataURL(f);
    });

    function switchTab(t){
      document.getElementById('tabCreate').classList.toggle('active', t==='create');
      document.getElementById('tabLogin').classList.toggle('active', t==='login');
      document.getElementById('createForm').style.display = t==='create'?'block':'none';
      document.getElementById('loginForm').style.display = t==='login'?'block':'none';
    }

    function createAccount(){
      var name = document.getElementById('cName').value.trim();
      var pass = document.getElementById('cPass').value;
      var err = document.getElementById('cErr');
      err.style.display = 'none';
      if (!name || !pass) { err.textContent='Preencha nome e senha'; err.style.display='block'; return; }
      // A conta passa a viver no servidor: é ela que te deixa entrar em qualquer
      // celular e aparecer para as outras pessoas.
      SYNC.criar(name, pass, photoData).then(function(j){
        SYNC.guardarSessao(j);
        window.location.href = 'app.html';
      }).catch(function(e){
        if (e && e.status) { err.textContent = (e.dados && e.dados.error) || e.message || 'Não deu para criar a conta'; err.style.display='block'; return; }
        criarContaLocal(name, pass);   // sem servidor: conta só neste aparelho
      });
    }

    function criarContaLocal(name, pass){
      var err = document.getElementById('cErr');
      var users = JSON.parse(localStorage.getItem('gl_users')||'[]');
      if (users.find(function(u){return u.name.toLowerCase()===name.toLowerCase();})) {
        err.textContent='Esse nome já existe. Tente "Entrar".'; err.style.display='block'; return;
      }
      var id = 'u'+Date.now();
      users.push({ id:id, name:name, username:name.toLowerCase().replace(/\s/g,'_'), password:pass, photo:photoData, bio:'', followers:0, following:[], likes:0, verified:false, verifiedType:null, isCreator:false, isAdmin:false, banned:false, banUntil:null, savedVideos:[] });
      localStorage.setItem('gl_users', JSON.stringify(users));
      localStorage.setItem('gl_current_user', id);
      window.location.href = 'app.html';
    }

    function loginAccount(){
      var name = document.getElementById('lName').value.trim();
      var pass = document.getElementById('lPass').value;
      var err = document.getElementById('lErr');
      err.style.display = 'none';
      SYNC.entrar(name, pass).then(function(j){
        // Banido também entra: lá dentro o app deixa só o próprio perfil e a
        // conversa com a assistente de suporte, que é quem libera a conta.
        SYNC.guardarSessao(j);
        window.location.href = 'app.html';
      }).catch(function(e){
        var users = JSON.parse(localStorage.getItem('gl_users')||'[]');
        var local = users.find(function(x){return x.name.toLowerCase()===name.toLowerCase() && x.password===pass;});
        // Conta antiga deste aparelho (de antes do servidor): registra no servidor
        // com a mesma senha, para ela valer em qualquer celular.
        if (local && (!e || !e.status || e.status === 404)) {
          SYNC.criar(name, pass, local.photo).then(function(j){
            SYNC.guardarSessao(j);
            window.location.href = 'app.html';
          }).catch(function(){
            localStorage.setItem('gl_current_user', local.id);
            window.location.href = 'app.html';
          });
          return;
        }
        err.textContent = (e && e.dados && e.dados.message) || 'Nome ou senha incorretos';
        err.style.display = 'block';
      });
    }

  </script>
</body>
</html>
