// Tira a capa do vídeo aqui no aparelho, antes de enviar, e mede a duração.
// É essa capa em JPEG que faz o feed abrir rápido: o card mostra a imagem na
// hora, sem baixar o vídeo inteiro só para desenhar o primeiro quadro.
function prepararCapa(file){
  return new Promise(function(ok){
    var url = URL.createObjectURL(file);
    var v = document.createElement('video');
    var entregou = false, dur = null, relogio = null;
    var entregar = function(blob){
      if(entregou) return;
      entregou = true;
      clearTimeout(relogio);
      try { URL.revokeObjectURL(url); } catch(e){}
      ok((dur || blob) ? { blob: blob || null, dur: dur } : null);
    };
    v.preload = 'metadata'; v.muted = true; v.setAttribute('playsinline','');
    v.onerror = function(){ entregar(null); };
    relogio = setTimeout(function(){ entregar(null); }, 8000);   // vídeo que não abre aqui
    v.onloadedmetadata = function(){
      dur = Math.round(v.duration) || null;
      // Um quadro pouco depois do começo: evita a tela preta do primeiro instante.
      var alvo = Math.min(Math.max((v.duration || 2) * 0.1, 0.1), 1.5);
      v.onseeked = function(){
        try {
          var c = document.createElement('canvas');
          c.width = 480;
          c.height = (v.videoWidth ? Math.round(480 * v.videoHeight / v.videoWidth) : 270) || 270;
          c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
          c.toBlob(function(b){ entregar(b); }, 'image/jpeg', 0.72);
        } catch(e){ entregar(null); }
      };
      try { v.currentTime = alvo; } catch(e){ entregar(null); }
    };
    v.src = url;
  });
}

// Sobe o vídeo e, junto, a capa. Se a capa não subir, o vídeo vai do mesmo jeito
// (aí o card mostra o quadro do próprio vídeo, como antes).
function enviaVideoComCapa(file, ext, capa){
  var dur = (capa && capa.dur) || null;
  return SYNC.upload(file, ext).then(function(r){
    var pronto = { url:r.url, poster:null, dur:dur || r.dur || null };
    if(!capa || !capa.blob) return pronto;
    return SYNC.upload(capa.blob, 'jpg').then(function(rc){
      pronto.poster = rc.url;
      return pronto;
    }).catch(function(){ return pronto; });
  });
}

// "extra" é o que o servidor devolve no envio: a capa pronta e a duração do
// vídeo, para o feed abrir rápido sem baixar o arquivo inteiro em cada card.
function publicarVideo(url, type, desc, extra){
  var u = curUser();
  desc = desc || document.getElementById('postDesc').value.trim() || 'Sem descrição';
  extra = extra || {};
  var vids = DB.videos();
  var vid = { id:'vid'+Date.now(), userId:u.id, userName:u.name, userPhoto:u.photo, url:url, poster:extra.poster||null, dur:extra.dur||null, description:desc, type:type, likes:0, views:0, comments:[], timestamp:Date.now(), likedBy:[], dislikedBy:[] };
  vids.unshift(vid);
  DB.saveVideos(vids);
  postFile = null;
  postFileUrl = null;
  showNotif(type==='short'?'Short publicado! ⚡🎉':'Vídeo publicado! 🎉');
  setTimeout(function(){ view=(type==='short'?'shorts':'home'); render(); }, 800);
}

function publishVideo(){
  if(blockedAction()) return;
  var url, desc;
  var type = postMode==='shorts' ? 'short' : 'video';
  if(postMode==='link'){
    url = document.getElementById('postUrl').value.trim();
    if(!url){ showNotif('Cole o link do vídeo! 🔗'); return; }
  } else {
    if(!postFile && !postFileUrl){ showNotif('Escolha um '+(type==='short'?'short':'vídeo')+' primeiro! 📹'); return; }
    desc = document.getElementById('postDesc').value.trim() || 'Sem descrição';
    if(postFile && window.SYNC && SYNC.logged()){
      // O vídeo sobe para o servidor: é isso que faz ele abrir no celular de
      // qualquer pessoa. Se o envio falhar, não publica um vídeo que só existe
      // aqui — ele ficaria preto e ninguém mais veria.
      showNotif('Enviando o vídeo... ⬆️');
      var ext = (String(postFile.name||'').split('.').pop() || 'mp4').toLowerCase();
      prepararCapa(postFile).then(function(capa){
        return enviaVideoComCapa(postFile, ext, capa);
      }).then(function(r){ publicarVideo(r.url, type, desc, r); })
        .catch(function(){ showNotif('Não deu para enviar o vídeo 📴 Confira a internet e tente de novo.'); });
      return;
    }
    url = postFileUrl;
  }
  publicarVideo(url, type, desc);
}

// Vídeos publicados antes de existir o servidor ficaram guardados só neste
// aparelho (url blob:/data:) — eles nunca abrem no celular de outra pessoa.
// Aqui eles sobem para o servidor; o que já não abre mais sai do feed, para
// ninguém ver um quadro preto no lugar do vídeo.
function subirVideosLocais(){
  if(!window.SYNC || !SYNC.logged()) return;
  var locais = DB.videos().filter(function(v){ return v.url && /^(blob:|data:)/.test(String(v.url)); });
  if(!locais.length) return;
  showNotif('Enviando '+locais.length+' vídeo(s) que ainda estavam só neste aparelho... ⬆️');
  locais.forEach(function(v){
    fetch(v.url).then(function(r){ return r.blob(); }).then(function(b){
      var t = String(b.type||'');
      var ext = t.indexOf('webm')>=0 ? 'webm' : (t.indexOf('quicktime')>=0 ? 'mov' : 'mp4');
      return prepararCapa(b).then(function(capa){ return enviaVideoComCapa(b, ext, capa); });
    }).then(function(r){
      var vids = DB.videos();
      var alvo = vids.find(function(x){ return x.id===v.id; });
      if(!alvo) return;
      alvo.url = r.url;
      alvo.poster = r.poster || alvo.poster || null;
      alvo.dur = r.dur || alvo.dur || null;
      DB.saveVideos(vids);
      if(view==='home'||view==='shorts') render();
    }).catch(function(){
      var restantes = DB.videos().filter(function(x){ return x.id!==v.id; });
      DB.saveVideos(restantes);
      if(view==='home'||view==='shorts') render();
    });
  });
}

function setVideoStat(vid, type, val){

  if(v){ v[type] = parseInt(val)||0; v.statAdj = Date.now(); DB.saveVideos(vids); }
}

  var users = DB.users();

function addFakeComment(){

function banUser(uid, duration){
  // Liberar = conta normal de novo: banimento e contador de palavrões zerados.
  if(duration===0){
    var livre = liberarUsuario(uid);
    if(!livre) return;
    showNotif(livre.name+' está livre de novo ✅');
    renderPanel();
    return;
  }
  var users = DB.users();
  var u = users.find(function(x){return x.id===uid;});
  if(!u) return;
  u.banned = true;
  u.banUntil = duration===-1 ? -1 : Date.now()+duration;
  DB.saveUsers(users);
  showNotif(u.name+' foi banido 🚫');
  renderPanel();
}

// Banir pelo tempo que eu quiser: horas e/ou dias.
function banUserCustom(uid){
  var hEl = document.getElementById('bh_'+uid);
  var dEl = document.getElementById('bd_'+uid);
  var h = parseInt(hEl && hEl.value) || 0;
  var d = parseInt(dEl && dEl.value) || 0;
  if(h<=0 && d<=0){ showNotif('Digite as horas ou os dias do banimento ⏱'); return; }
  banUser(uid, (h*3600000) + (d*86400000));
}

function adminId(){
  var c = DB.users().find(function(u){return u.isCreator;});
  return c ? c.id : null;
}

// Banido = banimento permanente (-1) ou ainda no prazo. Quando o prazo acaba, libera sozinho.
function isBanned(u){
  u = u || curUser();
  if(!u || !u.banned) return false;
  if(u.banUntil===-1) return true;
  if(u.banUntil && Date.now() < u.banUntil) return true;
  var users = DB.users();
  var x = users.find(function(y){return y.id===u.id;});
  if(x){ x.banned = false; x.banUntil = null; DB.saveUsers(users); }
  return false;
}

function banUntilLabel(u){
  if(!isBanned(u)) return 'liberado';
  if(u.banUntil===-1) return 'banido permanentemente';
  var ms = u.banUntil - Date.now();
  var h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
  return 'banido · '+(h>0?h+'h ':'')+m+'min restantes';
}

// Tempo do banimento no aviso vermelho do perfil: horas, dias ou permanente.
function banDurationLabel(u){
  if(!u) return 'Banimento permanente';
  if(u.banUntil===-1 || !u.banUntil) return 'Banimento permanente';
  var ms = Math.max(0, u.banUntil - Date.now());
  // Arredonda para cima no dia: ban de 3 dias não pode aparecer como 2.
  var horas = Math.round(ms/3600000);
  var dias = Math.round(horas/24);
  if(dias >= 2) return 'Banido por '+dias+' dias';
  if(horas >= 1) return 'Banido por '+horas+(horas===1?' hora':' horas');
  var min = Math.max(1, Math.round(ms/60000));
  return 'Banido por '+min+(min===1?' minuto':' minutos');
}

// Banimento por idade: quem declara ter 10 anos ou menos. Nesses casos o app
// mostra o recado da lei na tela e a conta fica banida de verdade.
var avisoIdadeVisto = false;

function banPorIdade(u){

}

// Bloqueia qualquer ação de quem está banido (postar, comentar, conversar, assistir).

// ==================== LIVE ====================
// Processo: Postar -> Live oferece dois modos (só a tela, ou tela + câmera
// frontal). Escolhido o modo, a captura da tela começa na hora e a live entra no
// ar: ela aparece na Home e no Shorts, e a bolinha flutuante fica na tela pulsando
// com o tempo. No APK a sobreposição fica por cima dos outros apps e a captura é
// a do próprio Android.
var overlayOn = false;
var liveTitle = null;
var liveTimer = null;
var liveMode = 'screen';   // 'screen' = só a tela | 'screenCam' = tela + câmera frontal
var liveWatchId = null;    // qual live está aberta na tela da transmissão
var chatLiveId = null;     // qual live está recebendo os comentários

// Todas as lives no ar: só as de verdade, feitas por quem está usando o app.
function livesOnAir(){
  var l = DB.live();
  return l ? [l] : [];
}

function findLive(id){
  var all = livesOnAir();
  for(var i=0;i<all.length;i++){ if(all[i].id===id) return all[i]; }
  return all[0] || null;
}

function openLiveView(id){
  var l = id ? findLive(id) : (DB.live() || livesOnAir()[0]);
  var u = curUser();
  // Entrar na live de outra pessoa conta como um espectador de verdade.
  if(l && u && l.userId !== u.id){
    l.viewers = (l.viewers||0) + 1;
    DB.saveLive(l);
  }
  liveWatchId = l ? l.id : null;
  view='live';
  render();
}

// Tempo no ar da live (m:ss ou h:mm:ss).
function liveElapsed(ts){
  var s = Math.max(0, Math.floor((Date.now()-(ts||Date.now()))/1000));
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return h>0 ? h+':'+pad2(m)+':'+pad2(sec) : m+':'+pad2(sec);
}

function tickLive(){
  var l = DB.live();
  if(l){
    var t = liveElapsed(l.startedAt);
    var a = document.getElementById('liveTime'); if(a) a.textContent = t;
    var b = document.getElementById('bubbleTime'); if(b) b.textContent = t;
  }
  // Cada card da Home tem o seu próprio relógio no ar.
  document.querySelectorAll('[data-live]').forEach(function(el){
    var lv = findLive(el.getAttribute('data-live'));
    if(lv) el.textContent = liveElapsed(lv.startedAt);
  });
}
function startLiveTick(){ if(liveTimer) clearInterval(liveTimer); liveTimer = setInterval(tickLive, 1000); }
function stopLiveTick(){ if(liveTimer){ clearInterval(liveTimer); liveTimer = null; } }

// Chat da live: só entra comentário de gente de verdade. Fica guardado no
// aparelho, então quem abrir a live vê o mesmo chat.
var liveChat = [];

function loadLiveChat(id){
  if(!id){ liveChat = []; return; }
  liveChat = (JSON.parse(localStorage.getItem('gl_livechat_'+id)||'[]')||[]).slice(-60);
}

function sendLiveComment(){
  var u = curUser();
  var el = document.getElementById('liveChatInput');
  var text = el ? el.value.trim() : '';
  if(!chatLiveId || !u || !text) return;
  if(checarTexto(text)) return;
  liveChat.push({name:u.name, text:text, ts:Date.now()});
  if(liveChat.length>60) liveChat = liveChat.slice(-60);
  localStorage.setItem('gl_livechat_'+chatLiveId, JSON.stringify(liveChat));
  el.value = '';
  paintLiveChat();
}

function paintLiveChat(){
  var el = document.getElementById('liveChatList');
  if(!el) return;
  el.innerHTML = liveChat.map(function(c){
    return '<div class="lc"><b>'+escapeHtml(c.name)+'</b> '+escapeHtml(c.text)+'</div>';
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function startLiveChat(id){
  var l = findLive(id);
  chatLiveId = l ? l.id : null;
  loadLiveChat(chatLiveId);
  paintLiveChat();
}

// Bolinha flutuante: pequena, fica na tela e é ela que começa a gravação.
function paintBubble(){
  var l = DB.live();
  var b = document.getElementById('liveBubble');
  if(!overlayOn || !l || view==='live' || l.userId!==curUser().id){ if(b) b.remove(); return; }
  if(!b){
    b = document.createElement('div');
    b.id = 'liveBubble';
    document.body.appendChild(b);
  }
  // Gravando: bolinha pulsando, com o tempo no ar; toque abre a tela da live.
  b.className = 'live-bubble rec';
  b.innerHTML = '<span class="dot"></span>'+
    '<span class="ball-time" id="bubbleTime">'+liveElapsed(l.startedAt)+'</span>';
  b.onclick = function(){ openLiveView(l.id); };
}

// Escolha do modo no Postar: guarda o título e começa a captura + a live.
function comecarLive(modo){
  if(blockedAction()) return;
  liveMode = modo;
  var t = document.getElementById('liveTitle');
  if(t && t.value.trim()) liveTitle = t.value.trim();
  capturarTela();
}

// O que aparece na live (a tela, ou a tela + a câmera frontal).
var liveStream = null;
var screenStream = null;  // captura da tela do aparelho
var camStream = null;     // câmera frontal (modo tela + câmera)
var mixTimer = null;      // desenha a tela com a câmera num quadradinho
var mix = null;

// Captura da tela. O Chrome do computador deixa gravar; o navegador do celular
// não — lá a live entra no ar sem imagem (no APK a captura é a do Android).
function capturarTela(){
  var md = navigator.mediaDevices;
  if(!md || !md.getDisplayMedia){ semImagem('Este navegador não grava a tela 📵'); return; }
  md.getDisplayMedia({video:true}).then(function(scr){
    screenStream = scr;
    var vt = scr.getVideoTracks()[0];
    if(vt) vt.addEventListener('ended', function(){ showNotif('A gravação de tela foi parada ⏹'); });
    if(liveMode!=='screenCam'){ liveStream = scr; abrirLive(); return; }
    return md.getUserMedia({video:{facingMode:'user'}}).then(function(cam){
      camStream = cam;
      juntarTelaECamera();
      abrirLive();
    }).catch(function(){
      liveStream = scr;
      showNotif('Sem a câmera frontal — gravando só a tela 📱');
      abrirLive();
    });
  }).catch(function(){ semImagem('A gravação de tela não abriu 📵'); });
}

// Sem captura: a live entra no ar e avisa que está sem imagem.
function semImagem(msg){ showNotif(msg+' A live entrou no ar sem imagem'); abrirLive(); }

// Modo tela + câmera frontal: a tela ocupa tudo e a câmera fica num quadradinho.
function juntarTelaECamera(){
  var cv = document.createElement('canvas');
  cv.width = 720; cv.height = 1280;
  var ctx = cv.getContext('2d');
  var vs = document.createElement('video'); vs.muted = true; vs.playsInline = true; vs.srcObject = screenStream; vs.play();
  var vc = document.createElement('video'); vc.muted = true; vc.playsInline = true; vc.srcObject = camStream; vc.play();
  mix = {cv:cv, ctx:ctx, vs:vs, vc:vc};
  if(mixTimer) clearInterval(mixTimer);
  mixTimer = setInterval(function(){
    if(!mix) return;
    var w = cv.width, h = cv.height;
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);
    cobrir(ctx, mix.vs, 0, 0, w, h);
    var cw = Math.round(w*0.3), ch = Math.round(cw*4/3);
    var cx = w-cw-16, cy = h-ch-16;
    ctx.fillStyle = '#fff'; ctx.fillRect(cx-3, cy-3, cw+6, ch+6);
    cobrir(ctx, mix.vc, cx, cy, cw, ch);
  }, 66); // ~15 quadros por segundo
  liveStream = cv.captureStream(15);
}

// Desenha o vídeo preenchendo a área (como o object-fit: cover).
function cobrir(ctx, v, x, y, w, h){
  if(!v.videoWidth) return;
  var s = Math.max(w/v.videoWidth, h/v.videoHeight);
  var dw = v.videoWidth*s, dh = v.videoHeight*s;
  ctx.drawImage(v, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
}

// Live no ar: salva a transmissão, liga o relógio e os comentários.
function abrirLive(){
  var u = curUser();
  var l = {id:'live'+Date.now(), userId:u.id, userName:u.name, userPhoto:u.photo, title:liveTitle||('Live de '+u.name), startedAt:Date.now(), viewers:1};
  DB.saveLive(l);
  overlayOn = true;
  liveWatchId = l.id;
  startLiveTick();
  startLiveChat(l.id);
  view = 'live';
  render();
  showNotif('Você está ao vivo 🔴 Sua live já está na Home');
}

function stopCamera(){
  if(liveStream){ liveStream.getTracks().forEach(function(t){ t.stop(); }); liveStream = null; }
  if(screenStream){ screenStream.getTracks().forEach(function(t){ t.stop(); }); screenStream = null; }
  if(camStream){ camStream.getTracks().forEach(function(t){ t.stop(); }); camStream = null; }
  if(mixTimer){ clearInterval(mixTimer); mixTimer = null; }
  mix = null;
}

// Encerrar: apertando na bolinha (que abre a tela da live) ou no botão dela.
function endLive(){
  stopLiveTick();
  stopCamera();
  DB.saveLive(null);
  overlayOn = false;
  liveWatchId = null;
  chatLiveId = null;
  var b = document.getElementById('liveBubble');
  if(b) b.remove();
  view = 'home';
  render();
  showNotif('Live encerrada 🔴');
}

// Tela da transmissão ao vivo (a sua ou a de outro usuário).

  if(!l){ view='home'; render(); return; }
  var owner = getUser(l.userId) || {name:l.userName, photo:l.userPhoto, verifiedType:null, isCreator:false};
  var mine = l.userId===u.id;
  if(chatLiveId!==l.id) startLiveChat(l.id);
  var html = '<div class="live-view">'+
    '<div class="live-top"><span class="live-pill"><span class="dot"></span>AO VIVO</span><span class="live-time" id="liveTime">'+liveElapsed(l.startedAt)+'</span></div>'+
    '<div class="live-stage">'+
      (mine && liveStream?
        '<video class="live-preview" id="livePreview" autoplay playsinline muted></video>'
      :
        '<div class="live-cam">📱</div>'+
        '<div class="live-note">'+(mine?
          (screenStream?'Gravando a tela do seu aparelho. No APK a sobreposição fica por cima dos outros apps.':'Sua live está no ar sem imagem — este navegador não grava a tela. No APK a captura é a do próprio Android.')
          :'Transmissão de '+escapeHtml(owner.name)+', ao vivo agora.')+'</div>'
      )+
    '</div>'+
    '<div class="live-chat" id="liveChatList"></div>'+
    '<div class="live-chat-input"><input id="liveChatInput" placeholder="Comentar na live..." onkeydown="if(event.key===\'Enter\')sendLiveComment()"><button onclick="sendLiveComment()">➤</button></div>'+
    '<div class="live-title">'+escapeHtml(l.title)+'</div>'+
    '<div class="live-sub">'+userNameDisplay(owner)+' · <span id="liveViewers">'+l.viewers+'</span> assistindo</div>'+
    (mine?'<button class="live-end" onclick="endLive()">Encerrar live</button>':'<button class="live-end" style="background:#F97316" onclick="view=\'shorts\';render()">Sair</button>')+
  '</div>';
  document.getElementById('app').innerHTML = html;

// Na conversa com quem atende (a assistente de suporte ou o criador), quem está

function sendApology(){

}

// ==================== MENSAGENS RECEBIDAS ====================
// Chegou mensagem privada? Aparece um aviso no topo com o nome de quem mandou
// (de quem está banido também) e, tocando nele, abre a conversa com a pessoa.
// Quem está banido só recebe aviso de quem atende: a assistente e o criador —
// é por aí que o pedido de liberação acontece.
function checarMensagensNovas(){
  var u = curUser();
  if(!u) return;
  var banido = isBanned(u);
  var atendem = [adminId(), suporteId()];
  var msgs = DB.privMsgs().filter(function(m){
    if(!m || m.toId!==u.id || m.sys) return false;
    return !banido || atendem.indexOf(m.fromId) >= 0;
  });
  if(!msgs.length) return;
  // A mensagem mais nova é a que vale: o aviso abre sempre a conversa de quem
  // acabou de escrever, e não a de uma mensagem antiga que ficou no meio da lista.
  var ultima = msgs[0];
  msgs.forEach(function(m){ if((m.ts||0) > (ultima.ts||0)) ultima = m; });
  // Mensagem que a assistente mandou pelo servidor (o convite dos três, por
  // exemplo) também fala: ela tem voz em qualquer tela do app.
  if(ultima.fromId===suporteId()) falarVozSuporte(ultima.text, ultima.id);
  var chave = 'gl_msgvista_'+u.id;
  var visto = parseInt(localStorage.getItem(chave) || '0', 10);
  if(!ultima.ts || ultima.ts <= visto) return;
  localStorage.setItem(chave, String(ultima.ts));
  // No convite para a conversa dos três eu abro a conversa com o banido, não
  // com quem mandou o aviso.
  var id = (ultima.trio && ultima.trio!==u.id) ? ultima.trio : ultima.fromId;
  // Se já estou na conversa com essa pessoa, não preciso de aviso.
  if(view==='pvb' && pvbView==='private' && pvbChatUser===id) return;
  var quem = getUser(id) || getUser(ultima.fromId);
  var nome = quem ? quem.name : 'Alguém';
  // O convite da conversa dos três é o recado mais importante que a assistente
  // manda: o aviso do topo diz que é ele e abre a conversa certa no toque —
  // para quem pediu a liberação, a conversa com a assistente; para o criador,
  // a conversa com quem está pedindo.
  var convite = !!(ultima.trio && ultima.fromId===suporteId());
  var dono = ultima.trio ? getUser(ultima.trio) : null;
  var aviso = convite
    ? (ultima.trio===u.id
      ? '📨 suporte good look: convite dos três enviado ao criador'
      : '📨 suporte good look chamou '+(dono?dono.name:nome)+' para a conversa dos três')
    : '💬 '+nome+' te mandou mensagem'+(quem && isBanned(quem)?' · banido 🚫':'');
  showNotif(aviso, function(){ abrirConversa(id); });
}

function abrirConversa(uid){
  pvbChatUser = uid;
  pvbView = 'private';
  view = 'pvb';
  render();
}

var notifAction = null, notifTimer = null;
function showNotif(msg, action){
  var n = document.getElementById('notif');
  n.textContent = msg;
  notifAction = action || null;
  n.classList.add('show');

  var n = document.getElementById('notif');
  n.classList.remove('show');
  if(notifTimer) clearTimeout(notifTimer);
  var acao = notifAction;
  notifAction = null;
  if(acao) acao();
}

// ==================== SEM BOTS ====================
// O app é de gente de verdade: nenhum bot posta, curte, comenta, ganha seguidor
// ou manda mensagem. Aqui a gente só apaga o que as versões antigas gravaram.
function limparBots(){
  var users = DB.users().filter(function(u){ return String(u.id||'').indexOf('bot_') !== 0; });
  users.forEach(function(u){
    // O selo azul é só do criador: tira de todo mundo.
    if(!u.isCreator && u.username!=='tex_tt' && (u.verified || u.verifiedType)){ u.verified = false; u.verifiedType = null; }
  });
  DB.saveUsers(users);
  var vids = DB.videos().filter(function(v){
    return !v.botPost && String(v.userId||'').indexOf('bot_') !== 0;
  });
  vids.forEach(function(v){
    if(v.comments && v.comments.length){
      v.comments = v.comments.filter(function(c){ return String(c.userId||'').indexOf('bot_') !== 0; });
    }
  });
  DB.saveVideos(vids);
  DB.savePrivMsgs(DB.privMsgs().filter(function(m){ return String(m.fromId||'').indexOf('bot_') !== 0; }));
}

// ==================== PALAVRÕES ====================
// Juntando 6 palavrões (no chat público, no privado ou nos comentários) a conta
// toma ban automático de 24h, e o motivo fica registrado no perfil dela.
var PALAVROES = ['porra','desgraça','disgraça','vagabundo','vagabunda','filho da puta','filha da puta','caralho','puta que pariu','vai tomar no cu'];
var LIMITE_PALAVROES = 6;
// Na conversa privada com o criador o limite é 2: dois palavrões já baniram.
var LIMITE_PALAVROES_CRIADOR = 2;

function contarPalavroes(text){
  var t = (text||'').toLowerCase();
  var n = 0;
  PALAVROES.forEach(function(p){
    var i = t.indexOf(p);
    while(i>=0){ n++; i = t.indexOf(p, i+p.length); }
  });
  return n;
}

// Roda antes de enviar a mensagem. Devolve true quando a conta acabou de ser banida.
function checarPalavroes(text, limite){
  var u = curUser();
  var n = contarPalavroes(text);
  if(!u || !n) return false;
  if(u.isCreator || u.isAdmin) return false; // o dono do app não toma ban
  limite = limite || LIMITE_PALAVROES;
  var users = DB.users();
  var x = users.find(function(y){ return y.id===u.id; });
  if(!x) return false;
  x.palavroes = (x.palavroes||0) + n;
  if(x.palavroes >= limite){
    x.banned = true;
    x.banUntil = Date.now() + 24*3600000;
    x.banReason = 'Palavrões repetidos ('+x.palavroes+'x): '+text.slice(0,40);
    DB.saveUsers(users);
    showNotif('Você foi banido por 24h 🚫 Motivo: palavras ofensivas');
    view = 'profile'; profileUserId = x.id;
    render();
    return true;
  }
  // O contador fica em silêncio: ninguém vê o aviso de palavrão, mas o ban continua valendo.
  DB.saveUsers(users);
  return false;
}

// ==================== IDADE MÍNIMA ====================
// O Good Look é para maiores de 10 anos. Quem diz que tem 10 anos ou menos (ou
// uma data de nascimento que dá essa idade) toma banimento permanente na hora,
// sem contador e sem aviso de advertência: o motivo aparece no perfil e só o
// criador pode liberar depois.
var IDADE_MINIMA = 11;

function idadeDeclarada(text){
  var t = (text||'').toLowerCase(), m;
  if((m = t.match(/(?:eu\s+)?tenho\s+(\d{1,3})\s*(?:anos?|aninhos)/))) return Number(m[1]);
  if((m = t.match(/(?:minha\s+)?idade\s*(?:é|e|:)?\s*(\d{1,3})/))) return Number(m[1]);
  if((m = t.match(/(\d{1,3})\s*(?:anos?|aninhos)\s+de\s+idade/))) return Number(m[1]);
  if((m = t.match(/(?:eu\s+)?(?:fiz|completei|acabei\s+de\s+fazer)\s+(\d{1,3})\s*(?:anos?|aninhos)/))) return Number(m[1]);
  if((m = t.match(/(?:nasci|nascido|nascida)\s+(?:em|no\s+ano\s+(?:de\s+)?)\s*((?:19|20)\d{2})/))) return new Date().getFullYear() - Number(m[1]);
  if(/sou\s+(?:um\s+|uma\s+)?(?:beb[eê]|crian[çc]a|menor\s+de\s+idade)/.test(t)) return 0;
  return null;
}

// Devolve true quando a conta acabou de ser banida por idade.
function checarIdade(text){
  var u = curUser();
  if(!u || u.isCreator || u.isAdmin) return false;
  var idade = idadeDeclarada(text);
  if(idade===null || idade >= IDADE_MINIMA) return false;
  var users = DB.users();
  var x = users.find(function(y){ return y.id===u.id; });
  if(!x) return false;
  x.banned = true;
  x.banUntil = -1;   // -1 = permanente
  x.banTipo = 'idade';
  x.banReason = 'Declarou ter menos de ' + IDADE_MINIMA + ' anos — o app é para maiores de 10 anos';
  DB.saveUsers(users);
  showNotif('Banimento permanente 🚫 O app é para maiores de 10 anos');
  view = 'profile'; profileUserId = x.id;
  render();
  return true;
}

// O que vale para tudo que eu escrevo: chat público, conversa privada,
// comentário e comentário da live.
function checarTexto(text, limite){
  if(checarIdade(text)) return true;
  return checarPalavroes(text, limite);
}

// ==================== STORAGE SYNC ====================
window.addEventListener('storage', function(e){
  if(e.key==='gl_pubmsg' && view==='pvb' && pvbView==='public') renderPVBPublic();
  if(e.key==='gl_privmsg' && view==='pvb' && pvbView==='private') renderPVBPrivate();
  if(e.key==='gl_videos' && view==='home') renderHome();
  if(e.key==='gl_videos' && view==='shorts') renderShorts();
  if(chatLiveId && e.key==='gl_livechat_'+chatLiveId && view==='live'){ loadLiveChat(chatLiveId); paintLiveChat(); }
});

// ==================== INIT ====================
(function(){
  // Ensure creator account exists
  var users = DB.users();
  var creator = users.find(function(u){return u.username==='tex_tt';});
  if(!creator){
    users.push({id:'creator',name:'tex_tt',username:'tex_tt',password:'12345678910',photo:null,bio:'👑 Criador do Good Look',followers:100000,following:[],likes:0,verified:true,verifiedType:'blue',isCreator:true,isAdmin:true,banned:false,banUntil:null,savedVideos:[]});
    DB.saveUsers(users);
  } else if(creator.name!=='tex_tt' || creator.password!=='12345678910'){
    creator.name = 'tex_tt';
    creator.password = '12345678910';
    DB.saveUsers(users);
  }
  // Conta de suporte: a assistente oficial do app. Ela vive no servidor e aqui
  // só garantimos que exista também no aparelho — é com ela que o aviso de ban
  // abre a conversa, mesmo quando o app está sem servidor.
  var suporte = users.find(function(u){ return u.id==='suporte' || u.username==='suporte_good_look'; });
  if(!suporte){
    users.push({id:'suporte',name:'suporte good look',username:'suporte_good_look',password:'54321',photo:null,bio:'🤖 Assistente oficial do Good Look — dúvidas, regras e suporte',followers:0,following:[],likes:0,verified:false,verifiedType:null,isCreator:false,isAdmin:false,isSupport:true,banned:false,banUntil:null,savedVideos:[]});
    DB.saveUsers(users);
  }
  // Os vídeos de exemplo antigos saem do banco: quem publica na Home e no Shorts
  // são as pessoas de verdade que usam o app.
  var vids = DB.videos().filter(function(v){ return ['v0','v1','v2','s0','s1','s2'].indexOf(v.id)<0; });
  DB.saveVideos(vids);
  limparBots();

  if(!curUser()){ window.location.href='home.html'; return; }
  // Sem sessão no servidor: quem tem servidor cai na tela de entrada (que entra
  // sozinha com a conta que já existe neste aparelho). Site aberto sem servidor
  // (GitHub Pages) continua funcionando só no aparelho.
  if(window.SYNC && !SYNC.logged()){
    SYNC.ping().then(function(){ window.location.href='home.html'; }).catch(function(){});
  }
  // Contas, vídeos, shorts e conversas ficam no servidor: o que acontece aqui
  // aparece no celular das outras pessoas (e o que elas fazem aparece aqui).
  if(window.SYNC) SYNC.start();
  // Sobe para o servidor os vídeos que ficaram presos neste aparelho.
  subirVideosLocais();
  // Se a página foi recarregada durante a MINHA live, a bolinha volta com ela.
  var liveAtual = DB.live();
  if(liveAtual && liveAtual.userId===curUser().id){ overlayOn = true; startLiveTick(); }
  // Só checa mensagem de gente de verdade chegando: nenhum bot roda por aqui.
  setInterval(checarMensagensNovas, 3000);
  render();
})();
