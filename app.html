<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Good Look</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#000;color:#fff}
#app{position:fixed;top:0;left:0;right:0;bottom:60px;overflow:hidden}
#nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#111;display:flex;align-items:center;justify-content:space-around;z-index:999;border-top:1px solid #222}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#666;font-size:10px;flex:1}
.nav-item.active{color:#F97316}
.nav-item svg{width:22px;height:22px}
.nav-post{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#F97316,#ea580c);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 8px rgba(249,115,22,.4)}
.nav-post svg{width:24px;height:24px}

/* Home feed */
.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000}
.feed::-webkit-scrollbar{display:none}
.video-slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.video-slide video{width:100%;height:100%;object-fit:contain}
.video-overlay{position:absolute;bottom:80px;right:12px;display:flex;flex-direction:column;gap:18px;z-index:5}
.video-info{position:absolute;bottom:80px;left:16px;right:80px;z-index:5}
.video-info .uname{font-size:16px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.video-info .desc{font-size:14px;color:#ddd;line-height:1.4}
.vbtn{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.vbtn svg{width:38px;height:38px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.vbtn .count{font-size:12px;font-weight:600}
.vbtn.liked svg{fill:#ff3b5c;stroke:#ff3b5c}
.vbtn.saved svg{fill:#F97316;stroke:#F97316}
.pause-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px;opacity:0;pointer-events:none;z-index:6;transition:opacity .2s}
.video-slide.paused .pause-icon{opacity:.7}
.tap-area{position:absolute;top:0;left:0;right:0;bottom:0;z-index:3}

/* Chat (IA + PVB) */
.chat-view{height:100%;display:flex;flex-direction:column;background:#0a0a0a}
.chat-header{padding:12px 16px;background:#111;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222}
.chat-header .back{cursor:pointer;color:#F97316;font-size:20px}
.chat-header .title{font-weight:700;flex:1;display:flex;align-items:center;gap:4px}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.chat-messages::-webkit-scrollbar{display:none}
.msg{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-break:break-word}
.msg.me{align-self:flex-end;background:#F97316;color:#fff}
.msg.them{align-self:flex-start;background:#1e1e1e;color:#fff}
.msg .name{font-size:11px;color:#888;margin-bottom:2px;display:flex;align-items:center;gap:3px}
.msg img{max-width:200px;border-radius:12px;margin-top:6px}
.chat-input{padding:10px;background:#111;display:flex;gap:8px;align-items:center;border-top:1px solid #222}
.chat-input input{flex:1;background:#1e1e1e;border:none;border-radius:20px;padding:10px 16px;color:#fff;font-size:14px;outline:none}
.chat-input button{width:38px;height:38px;border-radius:50%;border:none;background:#F97316;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-input .photo-btn{background:#1e1e1e;color:#999}
.chat-input svg{width:20px;height:20px}

/* PVB tabs */
.pvb-tabs{display:flex;background:#111;border-bottom:1px solid #222}
.pvb-tab{flex:1;padding:12px;text-align:center;font-size:14px;font-weight:600;color:#666;cursor:pointer;border-bottom:2px solid transparent}
.pvb-tab.active{color:#F97316;border-bottom-color:#F97316}
.user-list{flex:1;overflow-y:auto}
.user-row{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #1a1a1a}
.user-row:active{background:#1a1a1a}
.user-row .ava{width:44px;height:44px;border-radius:50%;background:#333;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#666;font-size:18px}
.user-row .ava img{width:100%;height:100%;object-fit:cover}
.user-row .info{flex:1}
.user-row .info .n{font-weight:600;font-size:14px;display:flex;align-items:center;gap:3px}
.user-row .info .s{font-size:12px;color:#666}
.user-row .acts{display:flex;gap:8px}
.user-row .acts button{padding:6px 12px;border-radius:8px;border:none;font-size:12px;cursor:pointer}
.user-row .acts .pbtn{background:#1e1e1e;color:#fff}
.user-row .acts .cbtn{background:#F97316;color:#fff}

/* Profile (visual claro, conforme a referência enviada) */
.pf-view{height:100%;overflow-y:auto;background:#f4f4f5;color:#18181b;padding-bottom:24px}
.pf-view::-webkit-scrollbar{display:none}
.banbar{display:flex;align-items:center;gap:10px;background:#e11900;color:#fff;padding:15px 16px}
.banbar .tx{flex:1;font-size:14px;font-weight:700;line-height:1.3}
.banbar .tx small{display:block;font-size:11.5px;font-weight:500;opacity:.92;margin-top:2px}
.banbar .go{font-size:22px;line-height:1;font-weight:700}
.pf-head{background:#fff;padding:18px 16px 16px;border-bottom:1px solid #e7e7ea}
.pf-top{display:flex;align-items:center;gap:14px}
.pf-ava{width:82px;height:82px;border-radius:50%;background:#e6e6e9;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#71717a;font-size:30px}
.pf-ava img{width:100%;height:100%;object-fit:cover}
.pf-stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.pf-stat .num{font-size:16px;font-weight:800;color:#111}
.pf-stat .lbl{font-size:11px;color:#71717a;margin-top:2px}
.pf-name{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:800;color:#111;margin-top:14px}
.pf-user{font-size:12.5px;color:#71717a;margin-top:3px}
.pf-bio{font-size:13.5px;color:#3f3f46;margin-top:10px;line-height:1.45}
.pf-rows{background:#fff;margin-top:10px;border-top:1px solid #e7e7ea;border-bottom:1px solid #e7e7ea}
.pf-row{display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:14px;font-weight:600;color:#18181b;border-bottom:1px solid #f1f1f3;cursor:pointer}
.pf-row:last-child{border-bottom:none}
.pf-row .ic{width:34px;height:34px;border-radius:10px;background:#f4f4f5;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.pf-row .ar{margin-left:auto;color:#a1a1aa;font-size:18px}
.pf-btns{display:flex;gap:10px;padding:14px 16px 0}
.pf-btns button{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer}
.pf-btn-light{background:#ececef;color:#3f3f46}
.pf-btn-dark{background:#111;color:#fff}
.pf-out{display:block;width:calc(100% - 32px);margin:16px auto 0;padding:15px;border-radius:12px;border:1px solid #efc4bd;background:#fff;color:#e11900;font-size:14.5px;font-weight:700;text-align:center;cursor:pointer}
.pf-note{margin:14px 16px 0;padding:14px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:13px;line-height:1.45}
.pf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#fff;padding:3px}
.pf-cell{position:relative;aspect-ratio:9/16;background:#e6e6e9;overflow:hidden;cursor:pointer}
.pf-cell video{width:100%;height:100%;object-fit:cover;display:block}
.pf-cell .vc{position:absolute;left:6px;bottom:5px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.pf-empty{padding:34px 20px;text-align:center;color:#71717a;font-size:14px}

/* Folha de opções (comentários) */
.sheet-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:80%;overflow-y:auto;background:#1c1c1c;border-radius:18px 18px 0 0;padding-bottom:8px;animation:sheetUp .18s ease}
@keyframes sheetUp{from{transform:translateY(26px);opacity:.65}to{transform:none;opacity:1}}
.sheet .sh-title{padding:12px 18px;font-size:12px;color:#8a8a8a;text-align:center}
.sheet .sh-item{display:flex;align-items:center;gap:12px;padding:15px 18px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;border-top:1px solid #262626}
.sheet .sh-item.danger{color:#ef4444}
.sheet .sh-cancel{text-align:center;padding:15px;font-size:15px;color:#8a8a8a;font-weight:600;cursor:pointer;border-top:1px solid #262626}
.cp-pin{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:#F97316;background:rgba(249,115,22,.14);border-radius:20px;padding:2px 7px;margin-left:4px}
.cp-rep{font-size:12.5px;color:#F97316;font-weight:700;margin-bottom:2px}
.cp-repbar{display:flex;align-items:center;gap:6px;padding:9px 14px;background:#111;border-top:1px solid #262626;font-size:12.5px;color:#ccc}
.cp-repbar b{color:#F97316}
.cp-repbar .x{margin-left:auto;cursor:pointer;color:#888;font-size:16px}

/* Post */
.post-view{height:100%;overflow-y:auto;background:#0a0a0a;padding:20px}
.post-view::-webkit-scrollbar{display:none}
.post-view h2{font-size:20px;margin-bottom:20px;text-align:center}
.post-opts{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.post-opt{flex:1 1 44%;padding:16px;border-radius:12px;background:#1e1e1e;text-align:center;cursor:pointer;border:2px solid transparent}
.post-opt.active{border-color:#F97316}
.post-opt svg{width:32px;height:32px;color:#F97316;margin-bottom:8px}
.post-opt .t{font-size:13px;color:#ccc}
.post-field{width:100%;background:#1e1e1e;border:1px solid #333;border-radius:10px;padding:12px;color:#fff;font-size:14px;margin-bottom:12px;outline:none}
.post-field:focus{border-color:#F97316}
.post-preview{width:100%;max-height:200px;border-radius:12px;margin-bottom:12px;object-fit:contain;background:#111}
.post-btn{width:100%;padding:14px;border-radius:10px;border:none;background:#F97316;color:#fff;font-size:16px;font-weight:700;cursor:pointer}

/* Panel */
.panel-view{height:100%;overflow-y:auto;background:#0a0a0a;padding:16px}
.panel-view::-webkit-scrollbar{display:none}
.panel-view h2{font-size:18px;margin-bottom:16px;color:#F97316}
.panel-section{background:#1e1e1e;border-radius:12px;padding:16px;margin-bottom:16px}
.panel-section h3{font-size:15px;margin-bottom:12px;color:#F97316}
.panel-search{width:100%;background:#111;border:1px solid #333;border-radius:8px;padding:10px;color:#fff;font-size:14px;margin-bottom:12px;outline:none}
.panel-item{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #2a2a2a}
.panel-item .pi-ava{width:36px;height:36px;border-radius:50%;background:#333;overflow:hidden}
.panel-item .pi-ava img{width:100%;height:100%;object-fit:cover}
.panel-item .pi-name{flex:1;font-size:14px;display:flex;align-items:center;gap:3px}
.panel-item input{width:70px;background:#111;border:1px solid #333;border-radius:6px;padding:6px;color:#fff;font-size:13px;text-align:center}
.panel-item button{padding:6px 10px;border-radius:6px;border:none;background:#F97316;color:#fff;font-size:12px;cursor:pointer}
.panel-item .del{background:#ef4444}
.panel-tabs{display:flex;gap:8px;margin-bottom:16px}
.panel-tab{flex:1;padding:8px;border-radius:8px;background:#1e1e1e;text-align:center;font-size:13px;cursor:pointer;border:2px solid transparent}
.panel-tab.active{border-color:#F97316}
.ban-select{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ban-opt{padding:6px 12px;border-radius:6px;background:#ef4444;color:#fff;font-size:12px;cursor:pointer;border:none}

/* Verified badge */
.vbadge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex-shrink:0}
.vbadge svg{width:16px;height:16px}

/* Notifications */
.notif{position:fixed;top:0;left:0;right:0;background:#F97316;padding:12px 16px;z-index:9999;font-size:13px;display:none;align-items:center;gap:8px;cursor:pointer}
.notif.show{display:flex}

/* Live (transmissão) */
.live-pill{display:inline-flex;align-items:center;gap:6px;background:#e11900;color:#fff;font-size:12px;font-weight:800;border-radius:20px;padding:5px 11px;letter-spacing:.5px}
.live-pill .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:livePulse 1.1s infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.25}}
.live-card{border-color:#e11900}
.live-cover{position:relative;aspect-ratio:16/9;background:linear-gradient(160deg,#1d0a0a,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0 16px}
.live-ctitle{font-size:15px;font-weight:800;color:#fff;text-align:center;line-height:1.3}
.live-cmeta{font-size:11.5px;color:#9a9a9a;display:flex;align-items:center;gap:4px}
.live-watch{padding:9px 16px;border-radius:20px;border:none;background:#e11900;color:#fff;font-size:12.5px;font-weight:800;cursor:pointer;flex-shrink:0}
.live-slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(160deg,#1d0a0a,#000 70%);padding:0 24px}
.live-slide .lt{font-size:18px;font-weight:800;color:#fff;text-align:center;line-height:1.35}
.live-slide .ls{font-size:13px;color:#9a9a9a;display:flex;align-items:center;gap:5px}
.live-slide .lw{margin-top:4px;padding:12px 22px;border-radius:26px;border:none;background:#fff;color:#111;font-size:14px;font-weight:800;cursor:pointer}
.live-view{height:100%;display:flex;flex-direction:column;background:#0b0b0b;padding:18px 16px}
.live-top{display:flex;align-items:center;gap:10px}
.live-time{font-size:13px;font-weight:700;color:#ddd;font-variant-numeric:tabular-nums}
.live-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#141414;border-radius:16px;margin:14px 0}
.live-cam{font-size:52px}
.live-note{color:#8b8b8b;font-size:13px;text-align:center;padding:0 20px;line-height:1.45}
.live-preview{width:100%;flex:1;min-height:0;object-fit:cover;border-radius:16px;background:#000}
.live-chat{max-height:30%;overflow-y:auto;background:#141414;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.live-chat:empty{display:none}
.live-chat .lc{font-size:12.5px;color:#e5e5e5;line-height:1.35}
.live-chat .lc b{color:#F97316;font-weight:700}
.live-video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:0}
.live-cover .live-pill,.live-cover .live-ctitle,.live-cover .live-cmeta{position:relative;z-index:1}
.live-cover .live-ctitle,.live-cover .live-cmeta{text-shadow:0 1px 6px rgba(0,0,0,.9)}
.live-title{font-size:17px;font-weight:800;color:#fff}
.live-sub{font-size:12.5px;color:#8b8b8b;margin-top:4px;display:flex;align-items:center;gap:5px}
.live-end{width:100%;padding:15px;border-radius:12px;border:none;background:#e11900;color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:12px}
/* Bolinha flutuante pequena: ela é o botão que começa a gravação da live. */
.live-bubble{position:fixed;right:16px;bottom:80px;z-index:400;width:58px;height:58px;border-radius:50%;background:#e11900;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.55);cursor:pointer;animation:bubbleIn .22s ease}
.live-bubble svg{width:26px;height:26px}
.live-bubble .dot{width:15px;height:15px;border-radius:50%;background:#fff;animation:livePulse 1.1s infinite}
.live-bubble .ball-x{position:absolute;top:-5px;right:-5px;width:21px;height:21px;border-radius:50%;background:#1c1c1c;color:#fff;font-size:12px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;border:2px solid #0b0b0b}
.live-bubble .ball-time{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;font-size:10.5px;font-weight:800;border-radius:9px;padding:1px 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.live-bubble.rec{animation:ballPulse 1.5s infinite}
@keyframes ballPulse{0%,100%{box-shadow:0 0 0 0 rgba(225,25,0,.6)}50%{box-shadow:0 0 0 12px rgba(225,25,0,0)}}
@keyframes bubbleIn{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}

/* Home feed (cards) */
.home-wrap{height:100%;overflow-y:auto;background:#0b0b0b;padding-bottom:16px}
.home-wrap::-webkit-scrollbar{display:none}
.home-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 4px}
.home-head .t{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.2px}
.home-head .t b{color:#F97316}
.home-head .cnt{font-size:11px;font-weight:700;color:#F97316;background:rgba(249,115,22,.13);border:1px solid rgba(249,115,22,.32);padding:5px 10px;border-radius:20px}
.hcard{margin:12px 12px 0;border-radius:18px;background:#151515;overflow:hidden;border:1px solid #202020;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.hthumb{position:relative;width:100%;aspect-ratio:16/9;background:#0f0f0f;cursor:pointer;overflow:hidden}
.hthumb video{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.hthumb .scrim{position:absolute;left:0;right:0;bottom:0;height:75%;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.35) 55%,transparent);pointer-events:none}
.hthumb .htitle{position:absolute;left:12px;right:80px;bottom:11px;color:#fff;font-size:14.5px;font-weight:700;line-height:1.32;text-shadow:0 1px 6px rgba(0,0,0,.85);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* Duração do vídeo fica na capa */
/* Duração: 30s -> "30" · 30min -> "30:00" · 1h -> "1:00:00" */
.vdur{position:absolute;right:10px;bottom:10px;font-size:11.5px;font-weight:800;color:#fff;background:rgba(0,0,0,.75);border-radius:6px;padding:3px 7px;letter-spacing:.4px;z-index:2}
.hthumb .play-ov{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:rgba(249,115,22,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.hthumb .play-ov svg{width:24px;height:24px;color:#fff;margin-left:3px}
.hbody{display:flex;align-items:center;gap:10px;padding:10px 12px 12px}
.hbody .hinfo{flex:1;min-width:0}
.hbody .hname{font-size:13px;font-weight:700;color:#fff}
.hbody .hsub{font-size:11.5px;color:#8b8b8b;margin-top:3px}
.yt-ava{width:36px;height:36px;border-radius:50%;background:#333;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#666;font-size:16px}
.yt-ava img{width:100%;height:100%;object-fit:cover}
.yt-va{width:40px;height:40px;border-radius:50%;background:#333;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#666;font-size:16px}
.yt-va img{width:100%;height:100%;object-fit:cover}

/* Video detail / player view */
.vd-view{height:100%;overflow-y:auto;background:#0f0f0f}
.vd-view::-webkit-scrollbar{display:none}
.vd-player{width:100%;aspect-ratio:16/9;background:#000;position:relative}
.vd-player video{width:100%;height:100%;object-fit:contain}
.vd-back{position:absolute;top:12px;left:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5}
.vd-back svg{width:22px;height:22px;color:#fff}
.vd-body{padding:12px 14px}
.vd-title{font-size:17px;font-weight:700;color:#fff;line-height:1.3;margin-bottom:6px}
.vd-stats{font-size:13px;color:#aaa;margin-bottom:12px}
.vd-stats .more{color:#3ea6ff;cursor:pointer}
.vd-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid #222;margin-bottom:12px}

<body>
<div id="app"></div>
<div id="nav"></div>
<div class="notif" id="notif" onclick="this.classList.remove('show')"></div>

<script>
// ==================== DATA LAYER ====================
var DB = {
  users: function(){ return JSON.parse(localStorage.getItem('gl_users')||'[]'); },
  saveUsers: function(u){ localStorage.setItem('gl_users', JSON.stringify(u)); },
  videos: function(){ return JSON.parse(localStorage.getItem('gl_videos')||'[]'); },
  saveVideos: function(v){ localStorage.setItem('gl_videos', JSON.stringify(v)); },
  pubMsgs: function(){ return JSON.parse(localStorage.getItem('gl_pubmsg')||'[]'); },
  savePubMsgs: function(m){ localStorage.setItem('gl_pubmsg', JSON.stringify(m)); },
  privMsgs: function(){ return JSON.parse(localStorage.getItem('gl_privmsg')||'[]'); },
  savePrivMsgs: function(m){ localStorage.setItem('gl_privmsg', JSON.stringify(m)); },
  aiHist: function(){ return JSON.parse(localStorage.getItem('gl_aihist')||'[]'); },
  saveAiHist: function(h){ localStorage.setItem('gl_aihist', JSON.stringify(h)); },
  live: function(){ return JSON.parse(localStorage.getItem('gl_live')||'null'); },
  saveLive: function(l){ if(l) localStorage.setItem('gl_live', JSON.stringify(l)); else localStorage.removeItem('gl_live'); }
};

function curUser(){ var id=localStorage.getItem('gl_current_user'); return DB.users().find(function(u){return u.id===id;}); }
function getUser(id){ return DB.users().find(function(u){return u.id===id;}); }

// ==================== HELPERS ====================
function fmt(n){ if(n>=1e6) return (n/1e6).toFixed(1)+'M'; if(n>=1e3) return (n/1e3).toFixed(1)+'K'; return ''+n; }
function pad2(n){ return (n<10?'0':'')+n; }
// Duração mostrada na capa: 30s -> "30" · 30min -> "30:00" · 1h -> "1:00:00"
function fmtDur(sec){
  if(!sec || !isFinite(sec) || sec<=0) return '';
  sec = Math.floor(sec);
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if(h>0) return h+':'+pad2(m)+':'+pad2(s);
  if(m>0) return m+':'+pad2(s);
  return ''+s;
}
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function verifiedBadge(type){
  if(type==='blue') return '<span class="vbadge"><svg viewBox="0 0 24 24" fill="#2196F3"><path d="M12 1l2.4 2.4 3.4-.3 1 3.3 3 1.8-1.4 3.1 1.4 3.1-3 1.8-1 3.3-3.4-.3L12 22l-2.4-2.4-3.4.3-1-3.3-3-1.8 1.4-3.1L3.2 8.2l3-1.8 1-3.3 3.4.3z" fill="#2196F3"/><path d="M8.5 12l2.5 2.5 4.5-5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  if(type==='orange') return '<span class="vbadge"><svg viewBox="0 0 24 24"><path d="M12 1l2.4 2.4 3.4-.3 1 3.3 3 1.8-1.4 3.1 1.4 3.1-3 1.8-1 3.3-3.4-.3L12 22l-2.4-2.4-3.4.3-1-3.3-3-1.8 1.4-3.1L3.2 8.2l3-1.8 1-3.3 3.4.3z" fill="#ED8B38"/><path d="M8.5 12l2.5 2.5 4.5-5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  return '';
}
function userNameDisplay(u){ return '<span style="display:flex;align-items:center;gap:3px">'+escapeHtml(u.name)+(u.isCreator?'👑':'')+verifiedBadge(u.verifiedType)+'</span>'; }
function avatarHtml(u, sz, cls){
  var s=sz||44;
  var c=cls?(' '+cls):'';
  if(u && u.photo) return '<div class="'+c+'" style="width:'+s+'px;height:'+s+'px;border-radius:50%;overflow:hidden;flex-shrink:0"><img src="'+u.photo+'" style="width:100%;height:100%;object-fit:cover"></div>';
  return '<div class="'+c+'" style="width:'+s+'px;height:'+s+'px;border-radius:50%;background:#333;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#666;font-size:'+(s/2.5)+'px">'+(u?escapeHtml(u.name[0]||'?'):'?')+'</div>';
}

// ==================== STATE ====================
var view = 'home';
var pvbMode = 'public';
var pvbView = 'list';
var pvbChatUser = null;
var profileUserId = null;
var panelTab = 'videos';
var currentVideoId = null;
var feedObserver = null;
var botTimer = null;
var vdVideoId = null;

// ==================== NAV ====================
var ICONS = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>',
  pvb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  shorts: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 6.5L6.5 17.5"/><path d="M9 7l8.5-2.5L15 13z" fill="currentColor"/><path d="M15 17l-8.5 2.5L9 11z" fill="currentColor"/></svg>',
  post: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  profile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'
};

function renderNav(){
  var u = curUser();
  var items = [
    {key:'home', label:'Início', icon:ICONS.home},
    {key:'shorts', label:'Shorts', icon:ICONS.shorts},
    {key:'post', label:'Postar', icon:ICONS.post, circle:true},
    {key:'pvb', label:'PVB', icon:ICONS.pvb},
    {key:'profile', label:'Você', icon:ICONS.profile}
  ];
  var html = items.map(function(it){
    var cls = 'nav-item' + (view===it.key ? ' active' : '');
    if(it.circle) return '<div class="nav-item" onclick="navigate(\''+it.key+'\')"><div class="nav-post">'+it.icon+'</div><span>'+it.label+'</span></div>';
    return '<div class="'+cls+'" onclick="navigate(\''+it.key+'\')">'+it.icon+'<span>'+it.label+'</span></div>';
  }).join('');
  document.getElementById('nav').innerHTML = html;
}

function navigate(v){
  view = v;
  if(v==='profile') profileUserId = curUser().id;
  if(v==='pvb'){ pvbView='list'; }
  render();
}

// ==================== RENDER ====================
function render(){
  var u = curUser();
  if(!u){ window.location.href='/home'; return; }
  // Banido não posta, não conversa e não assiste vídeo: cai sempre no próprio perfil.
  if(isBanned(u) && !bannedViewAllowed(u)){
    view = 'profile';
    profileUserId = u.id;
  }
  document.getElementById('nav').style.display='flex';
  renderNav();
  switch(view){
    case 'home': renderHome(); break;
    case 'shorts': renderShorts(); break;
    case 'pvb': renderPVB(); break;
    case 'profile': renderProfile(); break;
    case 'post': renderPost(); break;
    case 'panel': renderPanel(); break;
    case 'detail': renderVideoDetail(); break;
    case 'live': renderLive(); break;
  }
  paintBubble();
}

// ==================== CARREGAMENTO DOS VÍDEOS ====================
// Cada vídeo só é baixado quando chega perto da tela e, nas miniaturas, buscamos
// apenas 1 quadro (#t=0.5) em vez do arquivo inteiro — assim a Home abre rápido
// mesmo em conexão lenta.
function niceNetwork(){
  try {
    var c = navigator.connection;
    if(!c) return true;
    if(c.saveData) return false;
    return !/(^|-)2g/.test(c.effectiveType||'');
  } catch(e){ return true; }
}

function attachLazyVideo(el){
  var src = el.getAttribute('data-src');
  if(!src || el.getAttribute('src')) return;
  el.setAttribute('preload','metadata');
  el.setAttribute('src', src + (el.dataset.thumb==='1' ? '#t=0.5' : ''));
  // Assim que o navegador sabe a duração, ela aparece na capa.
  if(el.dataset.dur==='1'){
    el.addEventListener('loadedmetadata', function(){
      var box = el.parentElement;
      var badge = box ? box.querySelector('.vdur') : null;
      if(badge && !badge.textContent) badge.textContent = fmtDur(el.duration);
    });
  }
}

function lazyLoadEls(els){
  var list = [].slice.call(els || []);
  if(list.length===0) return;
  if(!window.IntersectionObserver){ list.forEach(attachLazyVideo); return; }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ io.unobserve(e.target); attachLazyVideo(e.target); }
    });
  }, {rootMargin:(niceNetwork()?'420px 0px':'140px 0px')});
  list.forEach(function(el){ io.observe(el); });
}

// Deixa o próximo short já carregando (troca instantânea) — só em rede boa.
function preloadNeighbour(el){
  var slides = document.querySelectorAll('.video-slide video');
  var i = [].indexOf.call(slides, el);
  var next = slides[i+1];
  if(next && !next.getAttribute('src') && next.dataset.src){
    next.setAttribute('preload','auto');
    next.setAttribute('src', next.dataset.src);
  }
}

// ==================== HOME (feed de vídeos) ====================
function renderHome(){
  var vids = DB.videos().filter(function(v){return v.type!=='short';});
  if(vids.length===0 && !DB.live()){
    document.getElementById('app').innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#666;font-size:16px;text-align:center;padding:20px">Nenhum vídeo ainda.<br>Use o botão "+" para publicar! 🎬</div>';
    return;
  }
  var html = '<div class="home-wrap" id="homeFeed">'+
    '<div class="home-head"><div class="t">Good<b>Look</b> · Vídeos</div><div class="cnt">'+vids.length+' vídeos</div></div>';
  // Live no ar aparece em cima da Home também.
  var l = DB.live();
  if(l){
    var lo = getUser(l.userId) || {name:l.userName, photo:l.userPhoto, verifiedType:null, isCreator:false};
    html += '<div class="hcard live-card">'+
      '<div class="live-cover" onclick="openLiveView()">'+
        (liveStream && l.userId===curUser().id?'<video class="live-video" id="homeLiveVideo" autoplay playsinline muted></video>':'')+
        '<span class="live-pill"><span class="dot"></span>AO VIVO</span>'+
        '<div class="live-ctitle">'+escapeHtml(l.title)+'</div>'+
        '<div class="live-cmeta">'+userNameDisplay(lo)+' · <span id="liveCardTime">'+liveElapsed(l.startedAt)+'</span> no ar</div>'+
      '</div>'+
      '<div class="hbody">'+
        avatarHtml(lo,40,'yt-ava')+
        '<div class="hinfo"><div class="hname">'+userNameDisplay(lo)+'</div><div class="hsub">'+l.viewers+' assistindo agora</div></div>'+
        '<button class="live-watch" onclick="openLiveView()">'+(l.userId===curUser().id?'Ver minha live':'Assistir')+'</button>'+
      '</div>'+
    '</div>';
  }
  vids.forEach(function(v){
    var owner = getUser(v.userId) || {name:v.userName, photo:v.userPhoto, verifiedType:null, isCreator:false};
    html += '<div class="hcard">'+
      '<div class="hthumb" onclick="openVideoDetail(\''+v.id+'\')">'+
        '<video data-src="'+v.url+'" data-thumb="1" data-dur="1" muted playsinline preload="none"></video>'+
        '<div class="scrim"></div>'+
        '<div class="play-ov"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>'+
        '<div class="htitle">'+escapeHtml(v.description||'')+'</div>'+
        '<div class="vdur"></div>'+
      '</div>'+
      '<div class="hbody">'+
        avatarHtml(owner,40,'yt-ava')+
        '<div class="hinfo">'+
          '<div class="hname">'+userNameDisplay(owner)+'</div>'+
          '<div class="hsub">'+fmt(v.views||0)+' visualizações · '+timeAgoStr(v.timestamp)+'</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  });
  html += '</div>';
  document.getElementById('app').innerHTML = html;
  lazyLoadEls(document.querySelectorAll('#homeFeed video'));
  var hv = document.getElementById('homeLiveVideo');
  if(hv) hv.srcObject = liveStream;
}

function timeAgoStr(ts){
  if(!ts) return 'agora';
  var d = Math.floor((Date.now()-ts)/1000);
  if(d<60) return 'agora';
  if(d<3600) return 'há '+Math.floor(d/60)+' min';
  if(d<86400) return 'há '+Math.floor(d/3600)+' h';
  if(d<604800) return 'há '+Math.floor(d/86400)+' d';
  return 'há '+Math.floor(d/604800)+' sem';
}

// ==================== VIDEO DETAIL (player) ====================
function openVideoDetail(vid){
  if(blockedAction()) return;
  vdVideoId = vid;
  view = 'detail';
  var v = DB.videos().find(function(x){return x.id===vid;});
  if(v){ v.views = (v.views||0)+1; DB.saveVideos(DB.videos()); }
  render();
}

function renderVideoDetail(){
  var v = DB.videos().find(function(x){return x.id===vdVideoId;});
  if(!v){ view='home'; render(); return; }
  var u = curUser();
  var owner = getUser(v.userId) || {name:v.userName, photo:v.userPhoto, verifiedType:null, isCreator:false, followers:0};
  var liked = v.likedBy && v.likedBy.indexOf(u.id)>=0;

  var isFollowing = u.following && u.following.indexOf(owner.id)>=0;

  var pcu = previewCmt ? (getUser(previewCmt.userId) || {name:previewCmt.userName, photo:null, verifiedType:null}) : null;

  var html = '<div class="vd-view">'+
    '<div class="vd-player">'+
      '<video src="'+v.url+'" autoplay controls playsinline style="width:100%;height:100%;object-fit:contain"></video>'+
      '<div class="vd-back" onclick="view=\'home\';render()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></div>'+
    '</div>'+
    '<div class="vd-body">'+
      '<div class="vd-title">'+escapeHtml(v.description||'')+'</div>'+
      '<div class="vd-stats">'+fmt(v.likes||0)+' curtidas · '+fmt(v.views||0)+' visualizações · '+timeAgoStr(v.timestamp)+' <span class="more">...mais</span></div>'+
      '<div class="vd-actions">'+
        '<div class="vd-channel">'+
          avatarHtml(owner,40,'yt-va')+
          '<div class="vd-chinfo"><div class="vd-chname">'+userNameDisplay(owner)+'</div><div class="vd-chsub">'+fmt(owner.followers||0)+' inscritos</div></div>'+
        '</div>'+
        (owner.id===u.id?'':
          '<button class="vd-btn '+(isFollowing?'':'vd-member')+'" onclick="toggleFollowDetail(\''+owner.id+'\')">'+(isFollowing?'Inscrito ✓':'Inscrever-se')+'</button>'
        )+
        '<button class="vd-bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>'+
      '</div>'+
      '<div class="vd-actbar">'+
        '<div class="vd-actgrp">'+
          '<button class="vd-act'+(liked?' liked':'')+'" onclick="likeVideoDetail(\''+v.id+'\')">'+
            '<svg viewBox="0 0 24 24" fill="'+(liked?'#ff3b5c':'none')+'" stroke="'+(liked?'#ff3b5c':'#fff')+'" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.3a2 2 0 0 0 2-1.7l1.4-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>'+
            '<span>'+fmt(v.likes||0)+'</span>'+
          '</button>'+
          '<button class="vd-act'+(disliked?' liked':'')+'" onclick="dislikeVideoDetail(\''+v.id+'\')">'+
            '<svg viewBox="0 0 24 24" fill="'+(disliked?'#888':'none')+'" stroke="'+(disliked?'#888':'#fff')+'" stroke-width="2"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.7a2 2 0 0 0-2 1.7L2.3 13a2 2 0 0 0 2 2.3zM17 2h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/></svg>'+
          '</button>'+
        '</div>'+
        '<button class="vd-act" onclick="openComments(\''+v.id+'\')">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'+
          '<span>'+(v.comments?v.comments.length:0)+'</span>'+
        '</button>'+
        '<button class="vd-act" onclick="shareVideo(\''+v.id+'\')">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v14"/></svg>'+
          '<span>Compartilhar</span>'+
        '</button>'+
        '<button class="vd-act'+(saved?' liked':'')+'" onclick="saveVideoDetail(\''+v.id+'\')">'+
          '<svg viewBox="0 0 24 24" fill="'+(saved?'#F97316':'none')+'" stroke="'+(saved?'#F97316':'#fff')+'" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>'+
          '<span>Salvar</span>'+

function renderShorts(){
  var vids = DB.videos().filter(function(v){return v.type==='short';});
  var liveNow = DB.live();
  if(vids.length===0 && !liveNow){
    document.getElementById('app').innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#666;font-size:16px;text-align:center;padding:20px">Nenhum short ainda.<br>Use o botão "+" para adicionar! ⚡</div>';
    return;
  }
  var u = curUser();
  var html = '<div class="feed" id="feed">';
  // Quem está ao vivo aparece no primeiro slide do Shorts.
  if(liveNow){
    var lo = getUser(liveNow.userId) || {name:liveNow.userName, photo:liveNow.userPhoto, verifiedType:null, isCreator:false};
    html += '<div class="live-slide">'+
      '<span class="live-pill"><span class="dot"></span>AO VIVO</span>'+
      '<div class="lt">'+escapeHtml(liveNow.title)+'</div>'+
      '<div class="ls">'+userNameDisplay(lo)+' · <span id="liveCardTime">'+liveElapsed(liveNow.startedAt)+'</span> no ar</div>'+
      '<button class="lw" onclick="openLiveView()">'+(liveNow.userId===u.id?'Voltar para a minha live':'Assistir agora')+'</button>'+
    '</div>';
  }
  vids.forEach(function(v){
    var owner = getUser(v.userId) || {name:v.userName, photo:v.userPhoto, verifiedType:null, isCreator:false};
    var liked = v.likedBy && v.likedBy.indexOf(u.id)>=0;
    var saved = u.savedVideos && u.savedVideos.indexOf(v.id)>=0;
    html += '<div class="video-slide" data-vid="'+v.id+'">'+
      '<video data-src="'+v.url+'" loop playsinline muted preload="none"></video>'+
      '<div class="tap-area" onclick="togglePause(this)"></div>'+
      '<div class="pause-icon">⏸</div>'+
      '<div class="video-info">'+
        '<div class="uname">'+userNameDisplay(owner)+'</div>'+
        '<div class="desc">'+escapeHtml(v.description||'')+'</div>'+
      '</div>'+
      '<div class="video-overlay">'+
        '<div class="vbtn'+(liked?' liked':'')+'" onclick="likeShort(\''+v.id+'\')">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>'+
          '<span class="count">'+fmt(v.likes||0)+'</span>'+
        '</div>'+
        '<div class="vbtn" onclick="openComments(\''+v.id+'\')">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'+
          '<span class="count">'+(v.comments?v.comments.length:0)+'</span>'+
        '</div>'+
        '<div class="vbtn" onclick="shareVideo(\''+v.id+'\')">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v14"/></svg>'+
          '<span class="count">Compartilhar</span>'+
        '</div>'+
        '<div class="vbtn'+(saved?' saved':'')+'" onclick="saveShort(\''+v.id+'\')">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>'+
          '<span class="count">Salvar</span>'+
        '</div>'+
      '</div>'+
    '</div>';
  });
  html += '</div>';
  document.getElementById('app').innerHTML = html;

  if(feedObserver) feedObserver.disconnect();
  var vids2 = document.querySelectorAll('.video-slide video');
  feedObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      var el = e.target;
      if(e.isIntersecting && e.intersectionRatio>0.5){
        vids2.forEach(function(v){ v.pause(); v.muted=true; });
        // Baixa só o short que está na tela; o próximo só carrega em rede boa.
        attachLazyVideo(el);
        if(niceNetwork()) preloadNeighbour(el);
        var slide = el.closest('.video-slide');
        slide.classList.remove('paused');
        el.muted = false;
        el.play().then(function(){
          el.muted = false;
        }).catch(function(){
          el.muted = true;
          el.play().catch(function(){});
        });
      } else {
        el.pause();
      }
    });
  }, {threshold:[0.5]});
  vids2.forEach(function(v){ feedObserver.observe(v); });
}

// ==================== COMMENTS ====================
var cpReplyTo = null;

function isBlockedByMe(uid){
  var u = curUser();
  return !!(u && u.blocked && u.blocked.indexOf(uid)>=0);
}

// Comentários visíveis para mim: os de quem eu bloqueei somem, o fixado fica no topo.
function visibleComments(v){
  return (v.comments||[])
    .filter(function(c){ return !isBlockedByMe(c.userId); })
    .sort(function(a,b){
      if(!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
      return (a.ts||0)-(b.ts||0);
    });
}

// Garante um id para cada comentário (para fixar/excluir/bloquear com segurança).
function loadVideoWithIds(vid){
  var vids = DB.videos();
  var v = vids.find(function(x){return x.id===vid;});
  if(!v) return {vids:vids, v:null};
  var changed = false;
  (v.comments||[]).forEach(function(c,i){
    if(!c.id){ c.id = 'c'+(c.ts||Date.now())+'_'+i; changed = true; }
  });
  if(changed) DB.saveVideos(vids);
  return {vids:vids, v:v};
}

function commentsListHtml(v){
  var list = visibleComments(v);
  if(list.length===0) return '<div style="text-align:center;color:#666;padding:20px">Nenhum comentário ainda</div>';
  return list.map(function(c){
    var cu = getUser(c.userId) || {name:c.userName, photo:null, verifiedType:null, isCreator:false};
    return '<div class="cp-item">'+
      '<div class="ca" onclick="commentOptions(\''+v.id+'\',\''+c.id+'\')" style="cursor:pointer">'+(cu.photo?'<img src="'+cu.photo+'">':escapeHtml((cu.name||'?')[0]))+'</div>'+
      '<div class="ct">'+
        '<div class="cn" onclick="commentOptions(\''+v.id+'\',\''+c.id+'\')" style="cursor:pointer">'+userNameDisplay(cu)+(c.pinned?'<span class="cp-pin">📌 Fixado</span>':'')+'</div>'+
        (c.replyTo?'<div class="cp-rep">↳ '+escapeHtml(c.replyTo.userName)+'</div>':'')+
        '<div class="cc" onclick="startReply(\''+v.id+'\',\''+c.id+'\')" style="cursor:pointer">'+escapeHtml(c.text)+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function commentsPanelHtml(v){
  return '<div class="comments-panel show" id="cp">'+
    '<div class="cp-header">'+(v?(v.comments||[]).length:0)+' comentários'+
      (v && v.userId===curUser().id?'<div style="font-size:11px;color:#888;font-weight:400;margin-top:3px">Toque em quem comentou para fixar, excluir ou bloquear</div>':'')+
      '<span class="cp-close" onclick="closeComments()">×</span>'+
    '</div>'+
    '<div class="cp-list" id="cpList">'+(v?commentsListHtml(v):'')+'</div>'+
    (cpReplyTo?'<div class="cp-repbar">Respondendo <b>@'+escapeHtml(cpReplyTo.userName)+'</b><span class="x" onclick="cancelReply()">✕</span></div>':'')+
    '<div class="cp-input"><input id="cpText" placeholder="'+(cpReplyTo?('Responder @'+cpReplyTo.userName+'...'):'Comentar...')+'" onkeydown="if(event.key===\'Enter\')addComment()"><button onclick="addComment()">➤</button></div>'+
  '</div>';
}

function openComments(vid){
  if(blockedAction()) return;
  currentVideoId = vid;
  cpReplyTo = null;
  var r = loadVideoWithIds(vid);
  document.body.insertAdjacentHTML('beforeend', commentsPanelHtml(r.v));
}

function refreshComments(){
  var cp = document.getElementById('cp');
  if(!cp) return;
  var r = loadVideoWithIds(currentVideoId);
  cp.outerHTML = commentsPanelHtml(r.v);
  var inp = document.getElementById('cpText');
  if(inp) inp.focus();
}

function closeComments(){
  var cp = document.getElementById('cp');
  if(cp) cp.remove();
  cpReplyTo = null;
}

function findComment(vid, cid){
  var r = loadVideoWithIds(vid);
  if(!r.v) return null;
  var c = (r.v.comments||[]).find(function(x){return x.id===cid;});
  return c ? {v:r.v, comment:c} : null;
}

// Toque em quem comentou: dono do vídeo vê fixar/excluir/bloquear, os outros só bloqueiam.
function commentOptions(vid, cid){
  var f = findComment(vid, cid);
  if(!f) return;
  var u = curUser();
  if(f.comment.userId===u.id){ showNotif('Esse comentário é seu 🙂'); return; }
  var isOwner = f.v.userId===u.id;
  var html = '<div class="sheet-bg" id="cmtSheet" onclick="if(event.target.id===\'cmtSheet\')closeSheet()">'+
    '<div class="sheet">'+
      '<div class="sh-title">Comentário de '+escapeHtml(f.comment.userName)+'</div>'+
      (isOwner?
        '<div class="sh-item" onclick="pinComment(\''+vid+'\',\''+cid+'\')">📌 '+(f.comment.pinned?'Desafixar':'Fixar no topo')+'</div>'+
        '<div class="sh-item danger" onclick="deleteComment(\''+vid+'\',\''+cid+'\')">🗑 Excluir comentário</div>'
      :'')+
      '<div class="sh-item danger" onclick="blockCommenter(\''+vid+'\',\''+cid+'\')">🚫 Bloquear '+escapeHtml(f.comment.userName)+'</div>'+
      '<div class="sh-cancel" onclick="closeSheet()">Cancelar</div>'+
    '</div>'+
  '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

function closeSheet(){
  var s = document.getElementById('cmtSheet');
  if(s) s.remove();
}

function pinComment(vid, cid){
  var r = loadVideoWithIds(vid);
  if(!r.v) return;
  (r.v.comments||[]).forEach(function(c){ if(c.id!==cid) c.pinned = false; });
  var t = (r.v.comments||[]).find(function(c){return c.id===cid;});
  if(t) t.pinned = !t.pinned;
  DB.saveVideos(r.vids);
  closeSheet();
  refreshComments();
  if(t) showNotif(t.pinned?'Comentário fixado no topo 📌':'Comentário desafixado');
}

function deleteComment(vid, cid){
  var r = loadVideoWithIds(vid);
  if(!r.v) return;
  r.v.comments = (r.v.comments||[]).filter(function(c){return c.id!==cid;});
  DB.saveVideos(r.vids);
  closeSheet();
  refreshComments();
  showNotif('Comentário excluído 🗑');
}

function blockCommenter(vid, cid){
  var f = findComment(vid, cid);
  if(!f) return;
  var users = DB.users();
  var me = users.find(function(x){return x.id===localStorage.getItem('gl_current_user');});
  if(!me.blocked) me.blocked = [];
  if(me.blocked.indexOf(f.comment.userId)<0) me.blocked.push(f.comment.userId);
  DB.saveUsers(users);
  closeSheet();
  refreshComments();
  showNotif(f.comment.userName+' foi bloqueado 🚫');
}

// Responder um comentário
function startReply(vid, cid){
  var f = findComment(vid, cid);
  if(!f) return;
  cpReplyTo = {userId:f.comment.userId, userName:f.comment.userName};
  refreshComments();
}

function cancelReply(){
  cpReplyTo = null;
  refreshComments();
}

function addComment(){
  if(blockedAction()) return;
  var inp = document.getElementById('cpText');
  var text = inp ? inp.value.trim() : '';
  if(!text) return;
  var u = curUser();
  var r = loadVideoWithIds(currentVideoId);
  if(!r.v) return;
  if(!r.v.comments) r.v.comments = [];
  var c = {id:'c'+Date.now(), userId:u.id, userName:u.name, text:text, ts:Date.now()};
  if(cpReplyTo) c.replyTo = {userId:cpReplyTo.userId, userName:cpReplyTo.userName};
  r.v.comments.push(c);
  DB.saveVideos(r.vids);
  cpReplyTo = null;
  refreshComments();
}

function sendAIMsg(img){
  var input = document.getElementById('aiText');
  var text = input ? input.value.trim() : '';
  if(!text && !img) return;
  var hist = DB.aiHist();
  hist.push({role:'user', text:text, image:img, ts:Date.now()});
  DB.saveAiHist(hist);

  // Generate AI response with emojis
  var resp = aiResponse(text, img);
  setTimeout(function(){
    var h = DB.aiHist();
    h.push({role:'ai', text:resp, ts:Date.now()});
    DB.saveAiHist(h);
    renderIA();
    // Speak
    try {
      var sp = new SpeechSynthesisUtterance(resp.replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF]/gu, ''));
      sp.lang = 'pt-BR';
      sp.rate = 1.1;
      speechSynthesis.cancel();
      speechSynthesis.speak(sp);
    } catch(e){}
  }, 600);
  renderIA();
}

function aiResponse(text, img){
  text = (text||'').toLowerCase();
  if(img){
    return 'Que foto legal! 📸 Eu consegui ver a sua imagem! 😊 Parece muito interessante! 🔍✨';
  }
  if(text.match(/oi|olá|ola|e ai|eai/)) return 'Oi! 😊 Que bom falar com você! 🤖 Como posso ajudar? ✨';
  if(text.match(/tudo bem|como vai|como estas|td bem/)) return 'Tudo ótimo! 😄 E com você? 💖 Espero que esteja bem! 🌟';
  if(text.match(/nome|quem e você|quem e vc|o que voce e/)) return 'Eu sou a Good Look IA! 🤖✨ Sua assistente virtual! 😊';
  if(text.match(/ajuda|socorro|help/)) return 'Claro! 😊 Posso conversar, ver fotos 📸, responder perguntas... É só pedir! 🤖✨';
  if(text.match(/amor/)) return 'Amor é lindo! 💖😍 Espero que você tenha muito amor na vida! 🌹✨';
  if(text.match(/triste|mal|ruim|chato/)) return 'Poxa... 😢 Não fique assim! 🤗 As coisas vão melhorar! 💪✨';
  if(text.match(/feliz|bom|ótimo|otimo|legal/)) return 'Que maravilha! 😄🎉 Fico feliz por você! 💖✨';
  if(text.match(/vídeo|video/)) return 'Vídeos são incríveis! 🎬 Você pode postar na Home! 📱✨';
  if(text.match(/obrigad|valeu|vlw/)) return 'De nada! 😊🤖 Estou aqui sempre que precisar! 💖';
  if(text.match(/tchau|adeus|ate logo|flw/)) return 'Tchau! 👋😊 Volte logo! Vou sentir sua falta! 🤖💖';
  if(text.match(/comida|fome|almoço|almoco/)) return 'Hmm... 🍕🍔 Que fome! Que tal uma delícia? 😋✨';
  if(text.match(/música|musica|cantar/)) return 'Música é vida! 🎵🎶 Qual seu estilo favorito? 🎤✨';
  var responses = [
    'Entendi! 🤔 Deixe me pensar... 💭 '+text.charAt(0).toUpperCase()+text.slice(1)+' é interessante! 😊✨',
    'Poxa, que legal! 😄 Você disse: "'+text+'" 🤖 Vou lembrar disso! 💭',
    'Hmm... 🤔 Boa pergunta! 😊 Eu acho que sim! ✨🤖',
    'Que curioso! 😮💡 Me conta mais sobre isso! 🤖✨',
    'Adorei conversar com você! 😊💖 Você é muito legal! 🤖✨'
  ];
  return responses[Math.floor(Math.random()*responses.length)];
}

// ==================== PROFILE ====================
function viewProfile(uid){
  profileUserId = uid;
  view = 'profile';
  render();
}

function renderProfile(){
  var target = getUser(profileUserId) || curUser();
  var cu = curUser();
  var isMe = target.id === cu.id;
  var vids = DB.videos().filter(function(v){return v.userId===target.id;});
  var totalLikes = vids.reduce(function(s,v){return s+(v.likes||0);},0);
  var isFollowing = cu.following && cu.following.indexOf(target.id)>=0;
  var banned = isBanned(target);

  var html = '<div class="pf-view">';

  // Aviso vermelho: para o dono da conta o texto é "Sua conta foi banida" e abre a conversa
  // com o administrador; para quem está visitando aparece "Esta conta foi banida".
  if(banned){
    html += isMe
      ? '<div class="banbar" onclick="openAdminChat()"><div class="tx">Você foi banido. Veja detalhes...<small>'+banUntilLabel(target)+' · toque para conversar com o administrador</small></div><div class="go">›</div></div>'
      : '<div class="banbar"><div class="tx">Esta conta foi banida</div></div>';
  }

  html += '<div class="pf-head">'+
      '<div class="pf-top">'+
        '<div class="pf-ava">'+(target.photo?'<img src="'+target.photo+'">':escapeHtml((target.name||'?')[0]))+'</div>'+
        '<div class="pf-stats">'+
          '<div class="pf-stat"><div class="num">'+fmt(target.followers||0)+'</div><div class="lbl">Seguidores</div></div>'+
          '<div class="pf-stat"><div class="num">'+fmt((target.following||[]).length)+'</div><div class="lbl">Seguindo</div></div>'+
          '<div class="pf-stat"><div class="num">'+fmt(totalLikes)+'</div><div class="lbl">Curtidas</div></div>'+
        '</div>'+
      '</div>'+
      '<div class="pf-name">'+userNameDisplay(target)+(isMe?'<span style="font-size:13px;color:#71717a;cursor:pointer" onclick="editProfile()">✏️</span>':'')+'</div>'+
      '<div class="pf-user">@'+escapeHtml((target.username||target.name||'').toLowerCase())+'</div>'+
      '<div class="pf-bio">'+(target.bio?escapeHtml(target.bio):'Sem bio')+'</div>'+
      '<div class="pf-btns">'+
        (isMe?
          '<button class="pf-btn-light" onclick="editProfile()">Editar perfil</button>'+
          (!banned && target.isCreator?'<button class="pf-btn-dark" onclick="view=\'panel\';render()">Painel</button>':'')+
          (!banned && !target.isCreator?'<button class="pf-btn-dark" onclick="view=\'post\';render()">Postar vídeo</button>':'')
        :
          '<button class="'+(isFollowing?'pf-btn-light':'pf-btn-dark')+'" onclick="toggleFollow(\''+target.id+'\')">'+(isFollowing?'Adicionar amigos ✓':'Adicionar amigos')+'</button>'+
          '<button class="pf-btn-light" onclick="shareProfile(\''+target.id+'\')" style="flex:0 0 52px">🔗</button>'
        )+
      '</div>'+
    '</div>';

  // No meio da tela, o botão para sair da conta
  if(isMe) html += '<button class="pf-out" onclick="logout()">Sair dessa conta</button>';

  var rows = '';
  if(isMe && !banned && target.isCreator) rows += '<div class="pf-row" onclick="view=\'panel\';render()"><div class="ic">⚡</div>Central do Criador<div class="ar">›</div></div>';
  if(isMe && !banned && (cu.savedVideos||[]).length>0) rows += '<div class="pf-row" onclick="openSaved()"><div class="ic">🔖</div>Vídeos salvos ('+(cu.savedVideos||[]).length+')<div class="ar">›</div></div>';
  if(!isMe) rows += '<div class="pf-row" onclick="startPrivateChat(\''+target.id+'\')"><div class="ic">💬</div>Conversar com '+escapeHtml(target.name)+'<div class="ar">›</div></div>';
  if(rows) html += '<div class="pf-rows">'+rows+'</div>';

  if(banned){
    html += '<div class="pf-note">🚫 '+(isMe?'Sua conta está banida: você não pode postar, conversar nem assistir vídeos até o banimento acabar.':'Este perfil está banido e os vídeos ficaram indisponíveis.')+'</div>';
  } else {
    html += vids.length
      ? '<div class="pf-grid">'+vids.map(function(v){
          return '<div class="pf-cell" onclick="playProfileVideo(\''+v.id+'\')">'+
            '<video data-src="'+v.url+'" data-thumb="1" data-dur="1" muted playsinline preload="none"></video>'+
            '<div class="vc">▶ '+fmt(v.views||0)+'</div>'+
            '<div class="vdur"></div>'+
          '</div>';
        }).join('')+'</div>'
      : '<div class="pf-empty">Nenhum vídeo postado ainda 🎬</div>';

  html += '</div>';
  document.getElementById('app').innerHTML = html;
  lazyLoadEls(document.querySelectorAll('.pf-view video'));

function openSaved(){
  var u = curUser();
  var ids = u.savedVideos || [];

            '</div>';

function closeSaved(){
  var m = document.getElementById('savedModal');
  if(m) m.remove();
}

function shareProfile(uid){
  var u = getUser(uid) || {};
  if(navigator.share){ navigator.share({title:u.name||'Good Look', text:'Veja o perfil de '+(u.name||'')+' no Good Look!', url:location.href}).catch(function(){}); }
  else showNotif('Link do perfil copiado! 📋');
}

function toggleFollow(uid){
  var users = DB.users();
  var cu = users.find(function(x){return x.id===localStorage.getItem('gl_current_user');});
  var tu = users.find(function(x){return x.id===uid;});
  if(!cu.following) cu.following = [];
  var idx = cu.following.indexOf(uid);
  if(idx>=0){ cu.following.splice(idx,1); tu.followers = Math.max(0,(tu.followers||0)-1); }
  else { cu.following.push(uid); tu.followers = (tu.followers||0)+1; }
  DB.saveUsers(users);
  renderProfile();
}

function playProfileVideo(vid){
  var v = DB.videos().find(function(x){return x.id===vid;});
  if(!v) return;
  v.views = (v.views||0)+1;
  DB.saveVideos(DB.videos());
  var html = '<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:500;display:flex;align-items:center;justify-content:center" id="pvModal">'+
    '<video src="'+v.url+'" autoplay controls style="width:100%;height:100%;object-fit:contain"></video>'+
    '<div style="position:absolute;top:16px;right:16px;font-size:28px;cursor:pointer;color:#fff;z-index:501" onclick="document.getElementById(\'pvModal\').remove()">×</div>'+
    '<div style="position:absolute;bottom:80px;left:16px;right:16px;z-index:501">'+
      '<div style="font-weight:700;margin-bottom:4px">'+escapeHtml(v.description||'')+'</div>'+
      '<div>❤ '+fmt(v.likes||0)+' · ▶ '+fmt(v.views||0)+' · 💬 '+(v.comments?v.comments.length:0)+'</div>'+
    '</div>'+
  '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

function editProfile(){
  var u = curUser();
  var html = '<div class="edit-modal show" id="editModal">'+
    '<div class="edit-card">'+
      '<h3>Editar Perfil</h3>'+
      '<div class="eava" id="eAva" onclick="document.getElementById(\'ePhoto\').click()">'+(u.photo?'<img src="'+u.photo+'">':escapeHtml((u.name||'?')[0]))+'</div>'+
      '<input type="file" id="ePhoto" accept="image/*" style="display:none">'+
      '<input class="post-field" id="eName" placeholder="Nome" value="'+escapeHtml(u.name)+'">'+
      '<input class="post-field" id="eBio" placeholder="Bio" value="'+escapeHtml(u.bio||'')+'">'+
      '<button class="post-btn" onclick="saveProfile()">Salvar</button>'+
      '<button class="post-btn" style="background:#333;margin-top:8px" onclick="document.getElementById(\'editModal\').remove()">Cancelar</button>'+
    '</div>'+
  '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
  var newPhoto = null;
  document.getElementById('ePhoto').addEventListener('change', function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(ev){ newPhoto = ev.target.result; document.getElementById('eAva').innerHTML = '<img src="'+newPhoto+'">'; };
    r.readAsDataURL(f);
  });
  window._newPhoto = function(){ return newPhoto; };
}

function saveProfile(){
  var users = DB.users();
  var u = users.find(function(x){return x.id===localStorage.getItem('gl_current_user');});
  u.name = document.getElementById('eName').value.trim() || u.name;
  u.bio = document.getElementById('eBio').value.trim();
  var np = window._newPhoto && window._newPhoto();
  if(np) u.photo = np;
  DB.saveUsers(users);
  document.getElementById('editModal').remove();
  renderProfile();
}

function logout(){
  localStorage.removeItem('gl_current_user');
  window.location.href = '/';
}

function publishVideo(){
  if(blockedAction()) return;
  var u = curUser();
  var url, desc;
  var type = postMode==='shorts' ? 'short' : 'video';
  if(postMode==='link'){
    url = document.getElementById('postUrl').value.trim();
    if(!url){ showNotif('Cole o link do vídeo! 🔗'); return; }
  } else {
    url = postFileUrl;
    if(!url){ showNotif('Escolha um '+(type==='short'?'short':'vídeo')+' primeiro! 📹'); return; }
  }
  desc = document.getElementById('postDesc').value.trim() || 'Sem descrição';
  var vids = DB.videos();
  var vid = { id:'vid'+Date.now(), userId:u.id, userName:u.name, userPhoto:u.photo, url:url, description:desc, type:type, likes:0, views:0, comments:[], timestamp:Date.now(), likedBy:[], dislikedBy:[], botLikes:0 };
  vids.unshift(vid);
  DB.saveVideos(vids);
  postFileUrl = null;
  showNotif(type==='short'?'Short publicado! ⚡🎉':'Vídeo publicado! 🎉');
  setTimeout(function(){ view=(type==='short'?'shorts':'home'); render(); }, 800);
}

function banUser(uid, duration){
  var users = DB.users();
  var u = users.find(function(x){return x.id===uid;});
  if(!u) return;
  if(duration===0){ u.banned=false; u.banUntil=null; showNotif(u.name+' está livre de novo ✅'); }
  else {
    u.banned = true;
    u.banUntil = duration===-1 ? -1 : Date.now()+duration;
    showNotif(u.name+' foi banido 🚫');
  }
  DB.saveUsers(users);
  renderPanel();
}

// Banir pelo tempo que eu quiser: horas e/ou dias.
function banUserCustom(uid){
  var hEl = document.getElementById('bh_'+uid);
  var dEl = document.getElementById('bd_'+uid);
  var h = parseInt(hEl && hEl.value) || 0;
  var d = parseInt(dEl && dEl.value) || 0;
  if(h<=0 && d<=0){ showNotif('Digite as horas ou os dias do banimento ⏱'); return; }
  banUser(uid, (h*3600000) + (d*86400000));
}

function filterVids(){
  var q = (document.getElementById('vidSearch').value||'').toLowerCase();
  document.querySelectorAll('#vidList .panel-item').forEach(function(el){
    el.style.display = el.dataset.name.indexOf(q)>=0 ? '' : 'none';

}

// ==================== BANIMENTO ====================
function adminId(){
  var c = DB.users().find(function(u){return u.isCreator;});
  return c ? c.id : null;
}

// Banido = banimento permanente (-1) ou ainda no prazo. Quando o prazo acaba, libera sozinho.
function isBanned(u){
  u = u || curUser();
  if(!u || !u.banned) return false;
  if(u.banUntil===-1) return true;
  if(u.banUntil && Date.now() < u.banUntil) return true;
  var users = DB.users();
  var x = users.find(function(y){return y.id===u.id;});
  if(x){ x.banned = false; x.banUntil = null; DB.saveUsers(users); }
  return false;
}

function banUntilLabel(u){
  if(!isBanned(u)) return 'liberado';
  if(u.banUntil===-1) return 'banido permanentemente';
  var ms = u.banUntil - Date.now();
  var h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
  return 'banido · '+(h>0?h+'h ':'')+m+'min restantes';
}

// O banido só pode ver o próprio perfil e a conversa com o administrador.
function bannedViewAllowed(u){
  if(view==='profile' && profileUserId===u.id) return true;
  return view==='pvb' && pvbView==='private' && pvbChatUser===adminId();
}

// Bloqueia qualquer ação de quem está banido (postar, comentar, conversar, assistir).
function blockedAction(){
  var u = curUser();
  if(!isBanned(u)) return false;
  showNotif('Sua conta está banida 🚫');
  view = 'profile';
  profileUserId = u.id;
  render();
  return true;
}

// "Veja detalhes" do aviso vermelho: abre direto a conversa privada com o administrador.
function openAdminChat(){
  var id = adminId();
  if(!id){ showNotif('Não encontrei o administrador 😕'); return; }
  pvbView = 'private';
  pvbChatUser = id;
  view = 'pvb';
  render();
}

// ==================== LIVE ====================
// Processo: Postar -> Live (a sobreposição já ativa). No APK a sobreposição fica
// por cima dos outros apps; aqui ela é uma bolinha flutuante pequena dentro do
// Good Look, e é ela que começa a gravação. Ao tocar na bolinha a câmera liga, a
// live aparece na Home e no Shorts, e a bolinha passa a pulsar com o tempo no ar.
var overlayOn = false;
var liveTitle = null;
var liveTimer = null;

function openLiveView(){ view='live'; render(); }

// Tempo no ar da live (m:ss ou h:mm:ss).
function liveElapsed(ts){
  var s = Math.max(0, Math.floor((Date.now()-(ts||Date.now()))/1000));
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return h>0 ? h+':'+pad2(m)+':'+pad2(sec) : m+':'+pad2(sec);
}

function tickLive(){
  var l = DB.live();
  if(!l) return;
  var t = liveElapsed(l.startedAt);
  ['liveTime','bubbleTime','liveCardTime'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.textContent = t;
  });
}
function startLiveTick(){ if(liveTimer) clearInterval(liveTimer); liveTimer = setInterval(tickLive, 1000); }
function stopLiveTick(){ if(liveTimer){ clearInterval(liveTimer); liveTimer = null; } }

// Enquanto a live está no ar, pessoas aleatórias comentam ao vivo.
var liveChat = [];
var liveChatTimer = null;
var liveViewers = 1;

function liveComment(){
  var l = DB.live();
  if(!l) return;
  liveChat.push({name:botNames[Math.floor(Math.random()*botNames.length)], text:botComments[Math.floor(Math.random()*botComments.length)]});
  if(liveChat.length>40) liveChat.shift();
  liveViewers += 1 + Math.floor(Math.random()*3);
  l.viewers = liveViewers;
  DB.saveLive(l);
  var v = document.getElementById('liveViewers');
  if(v) v.textContent = liveViewers;
  paintLiveChat();
}

function paintLiveChat(){
  var el = document.getElementById('liveChatList');
  if(!el) return;
  el.innerHTML = liveChat.map(function(c){
    return '<div class="lc"><b>'+escapeHtml(c.name)+'</b> '+escapeHtml(c.text)+'</div>';
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function startLiveChat(){
  liveChat = [];
  liveViewers = 1;
  if(liveChatTimer) clearInterval(liveChatTimer);
  liveChatTimer = setInterval(liveComment, 3500);
}
function stopLiveChat(){ if(liveChatTimer){ clearInterval(liveChatTimer); liveChatTimer = null; } }

// Bolinha flutuante: pequena, fica na tela e é ela que começa a gravação.
function paintBubble(){
  var l = DB.live();
  var b = document.getElementById('liveBubble');
  if(!overlayOn || (view==='live' && l)){ if(b) b.remove(); return; }
  if(!b){
    b = document.createElement('div');
    b.id = 'liveBubble';
    document.body.appendChild(b);
  }
  if(l){
    // Gravando: bolinha pulsando, com o tempo no ar; toque abre a tela da live.
    b.className = 'live-bubble rec';
    b.innerHTML = '<span class="dot"></span>'+
      '<span class="ball-time" id="bubbleTime">'+liveElapsed(l.startedAt)+'</span>';
    b.onclick = function(){ openLiveView(); };
  } else {
    // Pronta: toque na bolinha liga a câmera e começa a gravar.
    b.className = 'live-bubble';
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4" fill="currentColor" stroke="none"/></svg>'+
      '<span class="ball-x" onclick="event.stopPropagation();closeBubble()">✕</span>';
    b.onclick = function(){ startLive(); };
  }
}

function closeBubble(){ overlayOn = false; var b = document.getElementById('liveBubble'); if(b) b.remove(); }

// Escolher Live no Postar já ativa a sobreposição: guarda o título e mostra a bolinha.
function activateOverlay(){
  var t = document.getElementById('liveTitle');
  if(t && t.value.trim()) liveTitle = t.value.trim();
  overlayOn = true;
  paintBubble();
}

// Toque na bolinha: liga a câmera e a live começa a gravar.
function startLive(){
  if(blockedAction()) return;
  var u = curUser();
  var t = document.getElementById('liveTitle');
  if(t && t.value.trim()) liveTitle = t.value.trim();
  DB.saveLive({id:'live'+Date.now(), userId:u.id, userName:u.name, userPhoto:u.photo, title:liveTitle||('Live de '+u.name), startedAt:Date.now(), viewers:1});
  overlayOn = true;
  startCamera();
  startLiveTick();
  startLiveChat();
  liveComment(); // a primeira mensagem já aparece
  view = 'live';
  render();
  showNotif('Você está ao vivo 🔴 Já apareceu na Home e no Shorts');
}

// Câmera: a gravação só existe enquanto a live está no ar.
var liveStream = null;

// O navegador do computador consegue gravar a tela; o do celular não, então a
// gravação cai na câmera. No APK isso pode ser trocado pela captura do Android.
function startCamera(){
  var md = navigator.mediaDevices;
  if(!md) return;
  if(md.getDisplayMedia){
    md.getDisplayMedia({video:true}).then(useStream).catch(openCamera);
    return;
  }
  openCamera();
}

function openCamera(){
  var md = navigator.mediaDevices;
  if(!md || !md.getUserMedia) return;
  md.getUserMedia({video:true, audio:true}).then(useStream).catch(function(){
    showNotif('Não consegui abrir a câmera 📷');
  });
}

function useStream(stream){
  liveStream = stream;
  if(view==='live' || view==='home') render(); // mostra a gravação na tela
}

function stopCamera(){
  if(liveStream){ liveStream.getTracks().forEach(function(t){ t.stop(); }); liveStream = null; }
}

// Encerrar: apertando na bolinha (que abre a tela da live) ou no botão dela.
function endLive(){
  stopLiveTick();
  stopLiveChat();
  stopCamera();
  DB.saveLive(null);
  overlayOn = false;
  var b = document.getElementById('liveBubble');
  if(b) b.remove();
  view = 'home';
  render();
  showNotif('Live encerrada 🔴');
}

// Tela da transmissão ao vivo.
function renderLive(){
  var l = DB.live();
  var u = curUser();
  if(!l){ view='home'; render(); return; }
  var owner = getUser(l.userId) || {name:l.userName, photo:l.userPhoto, verifiedType:null, isCreator:false};
  var mine = l.userId===u.id;
  var html = '<div class="live-view">'+
    '<div class="live-top"><span class="live-pill"><span class="dot"></span>AO VIVO</span><span class="live-time" id="liveTime">'+liveElapsed(l.startedAt)+'</span></div>'+
    '<div class="live-stage">'+
      (mine && liveStream?
        '<video class="live-preview" id="livePreview" autoplay playsinline muted></video>'
      :
        '<div class="live-cam">📱</div>'+
        '<div class="live-note">'+(mine?'Sua live está no ar. No APK a sobreposição fica por cima dos outros apps.':'Transmissão de '+escapeHtml(owner.name)+', ao vivo agora.')+'</div>'
      )+
    '</div>'+
    '<div class="live-chat" id="liveChatList"></div>'+
    '<div class="live-title">'+escapeHtml(l.title)+'</div>'+
    '<div class="live-sub">'+userNameDisplay(owner)+' · <span id="liveViewers">'+l.viewers+'</span> assistindo</div>'+
    (mine?'<button class="live-end" onclick="endLive()">Encerrar live</button>':'<button class="live-end" style="background:#F97316" onclick="view=\'shorts\';render()">Sair</button>')+
  '</div>';
  document.getElementById('app').innerHTML = html;
  var pv = document.getElementById('livePreview');
  if(pv) pv.srcObject = liveStream;
  paintLiveChat();
}

// No chat com o administrador, quem está banido tem o pedido de desculpas na mão.
function sendApology(){
  var u = curUser();
  var id = adminId();

// ==================== BOTS ====================
var botNames = ['Lucas','Maria','Pedro','Ana','João','Carla','Bruno','Julia','Rafael','Camila','Felipe','Beatriz','Gustavo','Larissa','Diego','Marina','Thiago','Fernanda','Rodrigo','Patrícia'];
var botComments = ['Muito bom! 😍','Que legal! 🔥','Adorei! ❤️','KKKKK 😂','Top demais! 👏','Sensacional! 🎉','Incrível! ✨','Amei isso! 💖','Hahaha muito bom','Show! 🎬','Mano que vídeo 😂','Que conteúdo bom!','Parabéns! 👏','Sensacional 🔥','Top! 👍'];

function startBots(){
  if(botTimer) clearInterval(botTimer);
  botTimer = setInterval(function(){
    var vids = DB.videos();
    if(vids.length===0) return;
    // Like 1-2 random videos
    var n = 1 + Math.floor(Math.random()*2);
    var changed = false;
    for(var i=0; i<n; i++){
      var v = vids[Math.floor(Math.random()*vids.length)];
      v.likes = (v.likes||0) + 1;
      v.botLikes = (v.botLikes||0) + 1;
      changed = true;
    }
    // Occasionally add a comment
    if(Math.random() < 0.3){
      var v2 = vids[Math.floor(Math.random()*vids.length)];
      if(!v2.comments) v2.comments = [];
      var bn = botNames[Math.floor(Math.random()*botNames.length)];
      var bc = botComments[Math.floor(Math.random()*botComments.length)];
      v2.comments.push({userId:'bot_'+bn, userName:bn, text:bc, ts:Date.now()});
      changed = true;
    }
    if(changed){
      DB.saveVideos(vids);
      // If on home, update counts without full re-render
      if(view==='shorts'){
        var slides = document.querySelectorAll('.video-slide');
        slides.forEach(function(s){
          var vid = s.dataset.vid;
          var vd = vids.find(function(x){return x.id===vid;});
          if(vd){
            var cnt = s.querySelector('.vbtn .count');
            if(cnt) cnt.textContent = fmt(vd.likes||0);
          }
        });
      }
    }
  }, 3000);
}

});
